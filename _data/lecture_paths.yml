      title: What Graph Neural Networks Can and Cannot Distinguish
      post: graph-neural-network-expressivity
      source: ML4Mol Lecture 4; GDL Lecture 5
    - section: Neural architectures
      title: Depth, Over-Smoothing, and Over-Squashing in Graph Networks
      post: deep-graph-network-failure-modes
      source: ML4Mol Lecture 4; GDL Lecture 6
    - section: Neural architectures
      title: Symmetry and Equivariance for Geometric Data
      post: symmetry-equivariance-geometric-data
      source: ML4Mol Lecture 5; GDL Lectures 1–2
    - section: Neural architectures
      title: Scalar and Vector Geometric Graph Networks
      post: scalar-vector-geometric-gnns
      source: ML4Mol Lecture 5; GDL Lecture 7
    - section: Neural architectures
      title: Steerable Features and Tensor Products
      post: steerable-features-tensor-products
      source: ML4Mol Lecture 5; GDL Lectures 9–10
    - section: Neural architectures
      title: Equivariant Transformers and Machine-Learned Potentials
      post: equivariant-transformers-machine-learned-potentials
      source: ML4Mol Lecture 7; GDL Lectures 11–12
    - section: Generative models
      title: ODEs, SDEs, and Probability Flow
      post: odes-sdes-probability-flow
      source: ML4Mol Lecture 6; GDL Lecture 13
    - section: Generative models
      title: Diffusion Models and Flow Matching
      post: diffusion-models-flow-matching
      source: ML4Mol Lecture 6; GDL Lecture 14
    - section: Generative models
      title: Geometric Flow Matching on Manifolds
