ml4mol:
  title: Machine Learning for Molecules
  short_title: ML for Molecules
  permalink: /teaching/machine-learning-for-molecules/
  description: >-
    A route from the scientific language of molecules to graph and geometric
    architectures, generative models, molecular simulation, proteins, genomes,
    and materials. The sequence follows the 2025 lecture storyline while each
    chapter stands on its own.
  chapters:
    - section: Scientific foundations
      title: Chemistry and Physics for Molecular Machine Learning
      post: chemistry-physics-molecular-ml
      source: ML4Mol Lecture 2
    - section: Scientific foundations
      title: How Drug Discovery Turns Biological Hypotheses into Molecules
      post: drug-discovery-target-to-clinic
      source: ML4Mol Lecture 3
    - section: Scientific foundations
      title: Materials Discovery Connects Structure, Properties, and Synthesis
      post: materials-discovery-structure-properties-synthesis
      source: ML4Mol Lecture 3; GDL Lecture 21
