  type: conference
  title: Minimum Weight Perfect Matching via Blossom Belief Propagation
  authors:
  - Sungsoo Ahn
  - Sejun Park
  - Michael Chertkov
  - Jinwoo Shin
  venue: NeurIPS
  year: 2015
  abbr: NeurIPS
