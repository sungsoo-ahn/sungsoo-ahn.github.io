  - Sungsoo Ahn
  - Michael Chertkov
  - Jinwoo Shin
  venue: NeurIPS
  year: 2017
  abbr: NeurIPS
  arxiv: '1703.01056'
  html: https://proceedings.neurips.cc/paper/2017/file/8d420fa35754d1f1c19969c88780314d-Paper.pdf
  # Abstract source: https://arxiv.org/abs/1703.01056
  abstract: >-
    Computing partition function is the most important statistical inference task arising in
    applications of Graphical Models (GM). Since it is computationally intractable, approximate
    methods have been used to resolve the issue in practice, where mean-field (MF) and belief
    propagation (BP) are arguably the most popular and successful approaches of a variational type.
    In this paper, we propose two new variational schemes, coined Gauged-MF (G-MF) and Gauged-BP
    (G-BP), improving MF and BP, respectively. Both provide lower bounds for the partition function
    by utilizing the so-called gauge transformation which modifies factors of GM while keeping the
    partition function invariant. Moreover, we prove that both G-MF and G-BP are exact for GMs with
    a single loop of a special structure, even though the bare MF and BP perform badly in this case.
    Our extensive experiments, on complete GMs of relatively small size and on large GM (up-to 300
    variables) confirm that the newly proposed algorithms outperform and generalize MF and BP.
- id: ahn2016synthesis
  type: conference
  title: Synthesis of MCMC and Belief Propagation
  authors:
  - Sungsoo Ahn
  - Michael Chertkov
  - Jinwoo Shin
  venue: NeurIPS
  year: 2016
  abbr: NeurIPS
