  topic: Case Studies
  focus:
    - subtopic: Molecular modeling and simulation
      details: Molecular dynamics, learned collective variables, free-energy estimation, enhanced sampling, time-coarsened dynamics, and learned atomic transport.
      papers:
        - label: "Noé et al., Boltzmann Generators (2019)"
          url: "https://arxiv.org/abs/1812.01729"
        - label: "Klein et al., Timewarp (2023)"
          url: "https://proceedings.neurips.cc/paper_files/paper/2023/hash/a598c367280f9054434fdcc227ce4d38-Abstract-Conference.html"
        - label: "Nam et al., LiFlow (2025)"
          url: "https://www.nature.com/articles/s42256-025-01125-4"
    - subtopic: Quantum chemistry and electronic structure
      details: Neural wavefunctions, learned density functionals, machine-learning Hamiltonians, electron densities, orbitals, energies, and forces.
      papers:
        - label: "Pfau et al., FermiNet (2020)"
          url: "https://arxiv.org/abs/1909.02487"
        - label: "Kirkpatrick et al., DM21 (2021)"
          url: "https://pubmed.ncbi.nlm.nih.gov/34882476/"
        - label: "Kim et al., QHFlow2 (2026, preprint)"
          url: "https://arxiv.org/abs/2602.16897"
    - subtopic: Crystal and materials discovery
      details: Crystal representations, structure and property prediction, stability, generative discovery, and materials foundation models.
      papers:
        - label: "Merchant et al., GNoME (2023)"
          url: "https://www.nature.com/articles/s41586-023-06735-9"
        - label: "Zeni et al., MatterGen (2025)"
          url: "https://www.nature.com/articles/s41586-025-08628-5"
    - subtopic: Goal-directed and synthesis-aware molecular design
      details: Property guidance, reinforcement learning, Bayesian optimization, and GFlowNets for goal-directed and multi-objective design; reaction prediction, retrosynthesis, route search, and reaction-based generation for synthetic feasibility, with oracle reliability and experimental feasibility as design constraints.
      papers:
        - label: "Koziarski et al., RGFN (2024)"
          url: "https://proceedings.neurips.cc/paper_files/paper/2024/hash/53704142f230054140418ecd8857f391-Abstract-Conference.html"
        - label: "Seo et al., RxnFlow (2025)"
          url: "https://openreview.net/forum?id=pB1XSj2y4X"
        - label: "Gao et al., SynFormer (2025)"
          url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC12541314/"
    - subtopic: Protein structure prediction
      details: Sequence-to-structure models combine evolutionary information, protein language models, geometric reasoning, and confidence estimation.
      papers:
        - label: "Jumper et al., AlphaFold 2 (2021)"
          url: "https://www.nature.com/articles/s41586-021-03819-2"
        - label: "Abramson et al., AlphaFold 3 (2024)"
          url: "https://www.nature.com/articles/s41586-024-07487-w"
    - subtopic: Protein representation and design
      details: Sequence-based representation learning and single-sequence folding with ESM-2 and ESMFold; structure-conditioned inverse folding with ProteinMPNN; generative backbone design with RFdiffusion.
      papers:
        - label: "Lin et al., ESM-2 and ESMFold (2023)"
          url: "https://pubmed.ncbi.nlm.nih.gov/36927031/"
        - label: "Dauparas et al., ProteinMPNN (2022)"
          url: "https://pubmed.ncbi.nlm.nih.gov/36108050/"
        - label: "Watson et al., RFdiffusion (2023)"
          url: "https://www.nature.com/articles/s41586-023-06415-8"
    - subtopic: Genomics
      details: DNA and RNA foundation models support long-range sequence modeling, functional annotation, regulatory and variant-effect prediction, and sequence design.
      papers:
        - label: "Brixi et al., Evo 2 (2026)"
          url: "https://www.nature.com/articles/s41586-026-10176-5"
        - label: "Avsec et al., AlphaGenome (2026)"
          url: "https://www.nature.com/articles/s41586-025-10014-0"
    - subtopic: Virtual cells
      details: Single-cell representations, multimodal foundation models, perturbation prediction, and models of cell state and response.
      papers:
        - label: "Cui et al., scGPT (2024)"
          url: "https://www.nature.com/articles/s41592-024-02201-0"
        - label: "Adduri et al., State (2025, preprint)"
          url: "https://www.biorxiv.org/content/10.1101/2025.06.26.661135v1"
        - label: "Noutahi et al., Virtual Cells (2025, perspective)"
          url: "https://arxiv.org/abs/2505.14613"
  perspective: LLM-based tools support literature retrieval, protocols, code, and tool orchestration; AI scientists and self-driving laboratories combine specialized molecular models with active learning, automated experiments, and iterative model updates.

