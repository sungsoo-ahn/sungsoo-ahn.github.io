  topic: AI for Science Basics
  focus:
    - subtopic: Molecular and material representations
      details: SMILES and InChI, graphs, fingerprints, 3D coordinates, chirality, crystals, and symmetry.
      papers:
        - label: "Duvenaud et al., Neural Molecular Fingerprints (2015)"
          url: "https://arxiv.org/abs/1509.09292"
    - subtopic: Quantum foundations
      details: The Schrödinger equation, wavefunctions, orbitals, density functional theory, molecular orbitals, and band structure.
    - subtopic: Chemical and statistical foundations
      details: Chemical forces, statistical mechanics, free energy, molecular dynamics, potential-energy surfaces, and reaction kinetics.
    - subtopic: Drug discovery
      details: Small molecules and biologics, pharmacokinetics and pharmacodynamics, target identification, hit-to-lead optimization, clinical trials, and experimental assays.
      papers:
        - label: "Wallach et al., AtomNet (2015)"
          url: "https://arxiv.org/abs/1510.02855"
    - subtopic: Materials discovery
      details: Properties, stability, synthesis, characterization, batteries, semiconductors, catalysis, and direct air capture.
      papers:
        - label: "Xie and Grossman, CGCNN (2018)"
          url: "https://arxiv.org/abs/1710.10324"

