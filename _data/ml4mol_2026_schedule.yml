  topic: Architectures
  focus:
    - subtopic: Message-passing graph neural networks and graph transformers
      details: Message passing, attention, positional encodings, and global token interactions; GCN, GraphSAGE, GIN, GAT, and Graphormer.
      papers:
        - label: "Gilmer et al., MPNNs (2017)"
          url: "https://proceedings.mlr.press/v70/gilmer17a.html"
        - label: "Ying et al., Graphormer (2021)"
          url: "https://proceedings.neurips.cc/paper/2021/hash/f1c1592588411002af340cbaedd6fc33-Abstract.html"
    - subtopic: Molecular property prediction and benchmarks
      details: Supervised prediction from fingerprints, graphs, and three-dimensional representations, with molecular benchmarks and foundation models.
      papers:
        - label: "Wu et al., MoleculeNet (2018)"
          url: "https://arxiv.org/abs/1703.00564"
        - label: "Zhou et al., Uni-Mol (2023)"
          url: "https://openreview.net/forum?id=6K2RM6wVqKu"
    - subtopic: Geometric deep learning foundations
      details: Geometric graphs, Euclidean groups, group actions and representations, invariance, equivariance, and spherical harmonics.
      papers:
        - label: "Bronstein et al., Geometric Deep Learning (2021)"
          url: "https://arxiv.org/abs/2104.13478"
    - subtopic: Invariant models
      details: SchNet, DimeNet, and GemNet.
      papers:
        - label: "Schütt et al., SchNet (2018)"
          url: "https://arxiv.org/abs/1712.06113"
        - label: "Gasteiger et al., DimeNet (2020)"
          url: "https://arxiv.org/abs/2003.03123"
        - label: "Gasteiger et al., GemNet (2021)"
          url: "https://arxiv.org/abs/2106.08903"
    - subtopic: Vector-equivariant models
      details: EGNN and PaiNN.
      papers:
        - label: "Satorras et al., EGNN (2021)"
          url: "https://proceedings.mlr.press/v139/satorras21a.html"
        - label: "Schütt et al., PaiNN (2021)"
          url: "https://arxiv.org/abs/2102.03150"
    - subtopic: Spherical tensor models
      details: Irreducible representations, Clebsch-Gordan products, Tensor Field Networks, and NequIP.
      papers:
        - label: "Thomas et al., Tensor Field Networks (2018)"
          url: "https://arxiv.org/abs/1802.08219"
        - label: "Batzner et al., NequIP (2022)"
          url: "https://arxiv.org/abs/2101.03164"
    - subtopic: Modern interatomic-potential architectures
      details: Modern machine-learning interatomic potentials for energy and force prediction; MACE, eSCN, eSEN, Orb-v3, and UMA.
      papers:
        - label: "Batatia et al., MACE (2022)"
          url: "https://arxiv.org/abs/2206.07697"
        - label: "Rhodes et al., Orb-v3 (2025)"
          url: "https://arxiv.org/abs/2504.06231"
        - label: "Wood et al., UMA (2025)"
          url: "https://arxiv.org/abs/2506.23971"
