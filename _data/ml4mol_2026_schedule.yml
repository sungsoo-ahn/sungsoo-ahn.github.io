  topic: Generative Models
  focus:
    - subtopic: Probabilistic modeling and continuous normalizing flows
      details: Probability distributions, change of variables, likelihoods, transport maps, neural ODEs, and continuous normalizing flows.
      papers:
        - label: "Chen et al., Neural ODEs (2018)"
          url: "https://arxiv.org/abs/1806.07366"
        - label: "Grathwohl et al., FFJORD (2019)"
          url: "https://arxiv.org/abs/1810.01367"
    - subtopic: Stochastic dynamics and probability evolution
      details: ODEs and SDEs, Brownian motion, Itô calculus, Fokker-Planck equations, Langevin dynamics, continuity equations, and numerical simulation.
    - subtopic: Score-based diffusion models
      details: Forward and reverse diffusion, score functions, denoising score matching, reverse-time SDEs, and probability-flow ODEs.
      papers:
        - label: "Ho et al., Denoising Diffusion Probabilistic Models (2020)"
          url: "https://arxiv.org/abs/2006.11239"
        - label: "Song et al., Score-Based Generative Modeling through SDEs (2021)"
          url: "https://arxiv.org/abs/2011.13456"
    - subtopic: Flow matching and stochastic interpolants
      details: Conditional probability paths, marginal velocity fields, simulation-free training objectives, and stochastic interpolants.
      papers:
        - label: "Lipman et al., Flow Matching for Generative Modeling (2023)"
          url: "https://arxiv.org/abs/2210.02747"
        - label: "Albergo et al., Stochastic Interpolants (2023)"
          url: "https://arxiv.org/abs/2303.08797"
    - subtopic: Geometric generative processes
      details: Generative modeling on manifolds, tangent vector fields, rotations, SO(3), periodic coordinates, and equivariant probability paths.
      papers:
        - label: "Chen and Lipman, Flow Matching on General Geometries (2024)"
          url: "https://openreview.net/forum?id=g7ohDlTITL"
    - subtopic: Discrete generative processes
      details: Discrete diffusion and flow matching, continuous-time Markov chains, molecular graphs, sequences, and hybrid discrete-continuous states.
      papers:
        - label: "Campbell et al., Continuous-Time Discrete Denoising (2022)"
          url: "https://proceedings.neurips.cc/paper_files/paper/2022/hash/b5b528767aa35f5b1a60fe0aaeca0563-Abstract-Conference.html"
        - label: "Gat et al., Discrete Flow Matching (2024)"
          url: "https://proceedings.neurips.cc/paper_files/paper/2024/hash/f0d629a734b56a642701bba7bc8bb3ed-Abstract-Conference.html"
    - subtopic: Conditional and controlled generation
      details: Conditioning, guidance, energy-based steering, composition, constrained generation, and inverse problems; how these methods modify a base distribution for molecular design.
      papers:
        - label: "Dhariwal and Nichol, Classifier Guidance (2021)"
          url: "https://arxiv.org/abs/2105.05233"
        - label: "Ho and Salimans, Classifier-Free Guidance (2022)"
          url: "https://arxiv.org/abs/2207.12598"
    - subtopic: Modern molecular generative systems
      details: Diffusion and flow models for molecular graphs, three-dimensional molecules, conformers, protein-ligand structures, protein structures, and crystals across continuous, discrete, geometric, and hybrid state spaces.
      papers:
        - label: "Hoogeboom et al., Equivariant Diffusion for Molecule Generation in 3D (2022)"
          url: "https://proceedings.mlr.press/v162/hoogeboom22a.html"
        - label: "Corso et al., DiffDock (2023)"
          url: "https://openreview.net/forum?id=kKF8_K-mBbS"
        - label: "Hassan et al., ET-Flow (2024)"
          url: "https://proceedings.neurips.cc/paper_files/paper/2024/hash/e8bd617e7dd0394ceadf37b4a7773179-Abstract-Conference.html"

