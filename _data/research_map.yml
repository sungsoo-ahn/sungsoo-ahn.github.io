findings:
- title: Search can train the model that replaces it
  text: Genetic expert refinement, retrosynthesis self-improvement, planner imitation, latent veracity inference,
    and SGDS repeatedly turn search outcomes into reusable learned behavior. This is a useful cross-domain pattern;
    reward maximization, route discovery, step labeling, and distributional sampling retain different objectives.
  works:
  - ahn2020guiding
  - kim2021selfimproved
  - kim2023imitating
  - kim2026latent
  - kim2025scalable
- title: Feedback inside a trajectory is a recurring bottleneck
  text: LED-GFN explicitly decomposes terminal energy; reasoning confidence and latent veracity provide intermediate
    diagnostics; co-folding embeddings supply representation-level molecular feedback. Treat these as local-feedback
    connections, with credit assignment reserved for the stronger GFlowNet mechanism.
  works:
  - jang2024learning
  - jang2025selftraining
  - kim2026latent
  - jang2026boltz
- title: The choice of variables often matters as much as the learner
  text: Gauge transformations, sparse graph grammars, rigid/flexible/all-atom MOF parameterizations, DNA segmentation,
    and protein token views each change what is easy to express or compute. Their constraints and guarantees differ,
    so factorization is a connecting question rather than one universal method.
  works:
  - ahn2017gauging
  - jang2024simple
  - kim2025mofflow
  - kim2025flexible
  - kim2026atommof
  - kim2026dnachunker
  - kim2026atomlevel
- title: Exploration has both distributional and optimization meanings
  text: Genetic search, goal-space grids, local-search GFlowNets, adaptive teachers, and MCMC-assisted diffusion
    all expose insufficiently visited regions. GFlowNets and energy samplers seek distributions; genetic and combinatorial
    optimization principally seek good candidates.
  works:
  - ahn2020guiding
  - yoon2024breadthfirst
  - kim2024local
  - kim2025adaptive
