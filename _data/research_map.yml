- title: Useful invariance requires selective information retention
  text: Failure-based debiasing and committees identify misleading easy patterns; multi-bias learning balances conflicting
    groups; scTrilemma separates nuisance invariance from identity and expression fidelity. These connect through
    information selection, while biological nuisance and classifier bias are distinct phenomena.
