<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#665A75"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #231533; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #665A75; }
      .arrow { stroke: #665A75; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  
      <text x="500" y="42" text-anchor="middle" class="title">Reaction prediction is sparse graph editing with ambiguous bookkeeping</text>
      <rect x="35" y="88" width="565" height="390" rx="20" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/>
      <text x="318" y="128" text-anchor="middle" class="label">worked substitution: bromoethane to ethanol</text>
      <line x1="80" y1="210" x2="145" y2="210" stroke="#665A75" stroke-width="5" stroke-linecap="round"/><line x1="145" y1="210" x2="210" y2="210" stroke="#665A75" stroke-width="5" stroke-linecap="round"/><circle cx="80" cy="210" r="20" fill="#231533" stroke="white" stroke-width="3"/><text x="80" y="216" text-anchor="middle" fill="white" font-size="17" font-weight="700">C</text><circle cx="145" cy="210" r="20" fill="#231533" stroke="white" stroke-width="3"/><text x="145" y="216" text-anchor="middle" fill="white" font-size="17" font-weight="700">C</text><circle cx="210" cy="210" r="22" fill="#B7791F" stroke="white" stroke-width="3"/><text x="210" y="216" text-anchor="middle" fill="white" font-size="17" font-weight="700">Br</text><circle cx="95" cy="300" r="22" fill="#C7506B" stroke="white" stroke-width="3"/><text x="95" y="306" text-anchor="middle" fill="white" font-size="17" font-weight="700">O</text>
      <text x="95" y="345" text-anchor="middle" class="small">hydroxide</text>
      <path d="M 250 235 L 340 235" class="arrow"/>
      <text x="295" y="211" text-anchor="middle" class="small">predict edits</text>
      <line x1="390" y1="210" x2="455" y2="210" stroke="#665A75" stroke-width="5" stroke-linecap="round"/><line x1="455" y1="210" x2="520" y2="210" stroke="#665A75" stroke-width="5" stroke-linecap="round"/><circle cx="390" cy="210" r="20" fill="#231533" stroke="white" stroke-width="3"/><text x="390" y="216" text-anchor="middle" fill="white" font-size="17" font-weight="700">C</text><circle cx="455" cy="210" r="20" fill="#231533" stroke="white" stroke-width="3"/><text x="455" y="216" text-anchor="middle" fill="white" font-size="17" font-weight="700">C</text><circle cx="520" cy="210" r="22" fill="#C7506B" stroke="white" stroke-width="3"/><text x="520" y="216" text-anchor="middle" fill="white" font-size="17" font-weight="700">O</text><circle cx="510" cy="300" r="22" fill="#B7791F" stroke="white" stroke-width="3"/><text x="510" y="306" text-anchor="middle" fill="white" font-size="17" font-weight="700">Br</text>
      <text x="300" y="388" text-anchor="middle" class="body">delete C-Br; add C-O</text>
      <line x1="217" y1="190" x2="250" y2="223" stroke="#C7506B" stroke-width="4"/>
      <line x1="250" y1="190" x2="217" y2="223" stroke="#C7506B" stroke-width="4"/>
      <path d="M 425 290 L 455 248" stroke="#16877F" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
      <text x="318" y="437" text-anchor="middle" class="small">most atoms persist; the reaction center is small</text>

      <rect x="630" y="88" width="335" height="390" rx="20" fill="#F6F2FA" stroke="#C8BBD8" stroke-width="2"/>
      <text x="798" y="128" text-anchor="middle" font-size="16" font-weight="700">symmetric atoms allow several mappings</text>
      <line x1="735" y1="190" x2="800" y2="225" stroke="#665A75" stroke-width="5" stroke-linecap="round"/><line x1="735" y1="260" x2="800" y2="225" stroke="#665A75" stroke-width="5" stroke-linecap="round"/><circle cx="735" cy="190" r="22" fill="#C7506B" stroke="white" stroke-width="3"/><text x="735" y="196" text-anchor="middle" fill="white" font-size="17" font-weight="700">O1</text><circle cx="735" cy="260" r="22" fill="#C7506B" stroke="white" stroke-width="3"/><text x="735" y="266" text-anchor="middle" fill="white" font-size="17" font-weight="700">O2</text><circle cx="800" cy="225" r="22" fill="#231533" stroke="white" stroke-width="3"/><text x="800" y="231" text-anchor="middle" fill="white" font-size="17" font-weight="700">C</text>
      <path d="M 826 225 L 850 225" class="arrow"/>
      <line x1="875" y1="190" x2="940" y2="225" stroke="#665A75" stroke-width="5" stroke-linecap="round"/><line x1="875" y1="260" x2="940" y2="225" stroke="#665A75" stroke-width="5" stroke-linecap="round"/><circle cx="875" cy="190" r="22" fill="#C7506B" stroke="white" stroke-width="3"/><text x="875" y="196" text-anchor="middle" fill="white" font-size="17" font-weight="700">O2</text><circle cx="875" cy="260" r="22" fill="#C7506B" stroke="white" stroke-width="3"/><text x="875" y="266" text-anchor="middle" fill="white" font-size="17" font-weight="700">O1</text><circle cx="940" cy="225" r="22" fill="#231533" stroke="white" stroke-width="3"/><text x="940" y="231" text-anchor="middle" fill="white" font-size="17" font-weight="700">C</text>
      <text x="798" y="310" text-anchor="middle" class="body">equivalent oxygen labels can swap</text>
      <text x="798" y="341" text-anchor="middle" class="small">same unlabeled chemical graph</text>
      <rect x="675" y="375" width="245" height="66" rx="15" fill="#FFF4DC"/>
      <text x="798" y="401" text-anchor="middle" class="body">mapping is supervision</text>
      <text x="798" y="425" text-anchor="middle" class="small">inconsistency invents extra edits</text>

      <rect x="170" y="503" width="660" height="38" rx="12" fill="#E4F4F2"/>
      <text x="500" y="528" text-anchor="middle" class="body">Chemistry constrains the edit; atom mapping chooses a correspondence among valid symmetries.</text>
    
</svg>