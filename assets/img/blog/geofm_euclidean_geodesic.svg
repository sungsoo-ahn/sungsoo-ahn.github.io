<text x="745" y="424" text-anchor="middle" class="body">expₓ₀(t logₓ₀(x₁))</text><text x="745" y="449" text-anchor="middle" class="small">velocity stays tangent to the sphere</text>
<rect x="165" y="498" width="670" height="38" rx="13" fill="#FFF4DC"/><text x="500" y="523" text-anchor="middle" class="body">Euclidean addition is replaced by manifold motion generated in Tₓ𝓜</text></svg>