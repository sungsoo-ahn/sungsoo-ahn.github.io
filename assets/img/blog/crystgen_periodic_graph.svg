<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#665A75"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#231533}.title{font-size:22px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#665A75}.arrow{stroke:#665A75;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs><rect width="100%" height="100%" fill="white"/><text x="500" y="42" text-anchor="middle" class="title">A periodic graph makes neighbors cross the unit-cell boundary</text>
 <rect x="45" y="92" width="430" height="370" rx="20" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/><text x="260" y="130" text-anchor="middle" class="label">minimum-image neighborhood</text><rect x="100" y="175" width="320" height="220" fill="white" stroke="#5F6ED8" stroke-width="3" stroke-dasharray="8 6"/><circle cx="135" cy="285" r="14" fill="#C7506B"/><circle cx="385" cy="285" r="14" fill="#16877F"/><circle cx="455" cy="285" r="14" fill="#C7506B"/><line x1="135" y1="285" x2="385" y2="285" stroke="#665A75" stroke-width="4"/><line x1="385" y1="285" x2="455" y2="285" stroke="#665A75" stroke-width="4"/><text x="260" y="425" text-anchor="middle" class="small">the image at the right is the left atom in the next cell</text>
 <path d="M487 275L530 275" class="arrow"/><rect x="545" y="92" width="410" height="370" rx="20" fill="#F6F2FA" stroke="#C8BBD8" stroke-width="2"/><text x="750" y="130" text-anchor="middle" class="label">equivariant message passing</text><circle cx="650" cy="275" r="18" fill="#7A53EC"/><circle cx="750" cy="205" r="18" fill="#16877F"/><circle cx="850" cy="285" r="18" fill="#B7791F"/><circle cx="750" cy="355" r="18" fill="#C7506B"/><path d="M650 275L750 205L850 285L750 355Z" fill="none" stroke="#665A75" stroke-width="4"/><text x="750" y="405" text-anchor="middle" class="body">scalar output invariant</text><text x="750" y="432" text-anchor="middle" class="small">vector forces rotate with the crystal</text>
 <text x="500" y="515" text-anchor="middle" class="body">Periodic images are part of the graph; they are not extra atoms in the material.</text></svg>