<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#665A75"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#231533}.title{font-size:22px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#665A75}.arrow{stroke:#665A75;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs><rect width="100%" height="100%" fill="white"/><text x="500" y="42" text-anchor="middle" class="title">Motif scaffolding freezes the functional constraint and generates its support</text>
    <rect x="35" y="90" width="260" height="370" rx="20" fill="#FCE8EE" stroke="#C8BBD8" stroke-width="2"/><text x="165" y="128" text-anchor="middle" class="label">fixed motif</text><circle cx="155" cy="235" r="15" fill="#C7506B"/><circle cx="200" cy="205" r="15" fill="#C7506B"/><circle cx="240" cy="245" r="15" fill="#C7506B"/><path d="M155 235L200 205L240 245" fill="none" stroke="#C7506B" stroke-width="6"/><text x="165" y="325" text-anchor="middle" class="body">catalytic or binding geometry</text><text x="165" y="355" text-anchor="middle" class="small">identity and relative placement persist</text>
