<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#665A75"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #231533; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #665A75; }
      .arrow { stroke: #665A75; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  
      <text x="500" y="42" text-anchor="middle" class="title">Two vectors contain exactly three irreducible geometric products</text>
      <text x="153" y="110" text-anchor="middle" class="label">outer product x yᵀ</text>
      <rect x="75" y="170" width="52" height="52" fill="#EEF0FF" stroke="white" stroke-width="3"/><text x="101.0" y="202" text-anchor="middle" class="body">x1y1</text><rect x="127" y="170" width="52" height="52" fill="#E4F4F2" stroke="white" stroke-width="3"/><text x="153.0" y="202" text-anchor="middle" class="body">x1y2</text><rect x="179" y="170" width="52" height="52" fill="#F6F2FA" stroke="white" stroke-width="3"/><text x="205.0" y="202" text-anchor="middle" class="body">x1y3</text><rect x="75" y="222" width="52" height="52" fill="#E4F4F2" stroke="white" stroke-width="3"/><text x="101.0" y="254" text-anchor="middle" class="body">x2y1</text><rect x="127" y="222" width="52" height="52" fill="#F6F2FA" stroke="white" stroke-width="3"/><text x="153.0" y="254" text-anchor="middle" class="body">x2y2</text><rect x="179" y="222" width="52" height="52" fill="#EEF0FF" stroke="white" stroke-width="3"/><text x="205.0" y="254" text-anchor="middle" class="body">x2y3</text><rect x="75" y="274" width="52" height="52" fill="#F6F2FA" stroke="white" stroke-width="3"/><text x="101.0" y="306" text-anchor="middle" class="body">x3y1</text><rect x="127" y="274" width="52" height="52" fill="#EEF0FF" stroke="white" stroke-width="3"/><text x="153.0" y="306" text-anchor="middle" class="body">x3y2</text><rect x="179" y="274" width="52" height="52" fill="#E4F4F2" stroke="white" stroke-width="3"/><text x="205.0" y="306" text-anchor="middle" class="body">x3y3</text>
      <text x="153" y="365" text-anchor="middle" class="body">9 Cartesian components</text>
      <path d="M 250 248 L 348 248" class="arrow"/>

      <rect x="375" y="80" width="560" height="118" rx="20" fill="#F6F2FA" stroke="#C8BBD8" stroke-width="2"/>
      <circle cx="430" cy="139" r="30" fill="white" stroke="#7A53EC" stroke-width="3"/>
      <text x="430" y="147" text-anchor="middle" class="label">ℓ=0</text>
      <text x="500" y="130" class="body">scalar trace: x · y</text>
      <text x="500" y="159" class="small">1 component; invariant under rotation</text>

      <rect x="375" y="220" width="560" height="118" rx="20" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/>
      <path d="M 420 290 L 450 252" stroke="#5F6ED8" stroke-width="5" marker-end="url(#arrow)"/>
      <path d="M 420 290 L 460 300" stroke="#16877F" stroke-width="5" marker-end="url(#arrow)"/>
      <text x="500" y="270" class="body">antisymmetric part: x × y</text>
      <text x="500" y="299" class="small">3 components; transforms as a vector</text>

      <rect x="375" y="360" width="560" height="118" rx="20" fill="#E4F4F2" stroke="#C8BBD8" stroke-width="2"/>
      <ellipse cx="435" cy="419" rx="44" ry="23" fill="#16877F" opacity=".22" stroke="#16877F" stroke-width="3"/>
      <text x="500" y="405" class="body">symmetric traceless part</text>
      <text x="500" y="434" class="small">½(xyᵀ + yxᵀ) − ⅓(x · y)I</text>
      <text x="500" y="459" class="small">5 components; transforms as type ℓ=2</text>

      <rect x="200" y="505" width="600" height="38" rx="12" fill="#FFF4DC"/>
      <text x="500" y="530" text-anchor="middle" class="body">9 = 1 + 3 + 5, so 1 ⊗ 1 = 0 ⊕ 1 ⊕ 2</text>
    
</svg>