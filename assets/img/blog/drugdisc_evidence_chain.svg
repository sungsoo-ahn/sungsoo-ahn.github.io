<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#665A75"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7A53EC"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#231533}.title{font-size:22px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#665A75}.arrow{fill:none;stroke:#665A75;stroke-width:2.5;marker-end:url(#arr)}.parrow{fill:none;stroke:#7A53EC;stroke-width:3;marker-end:url(#arrp)}</style></defs><rect width="100%" height="100%" fill="white"/>
<text x="500" y="40" text-anchor="middle" class="title">A medicine requires four linked claims</text>
<rect x="30" y="100" width="205" height="330" rx="20" fill="#F2EDFF" stroke="#7A53EC" stroke-width="2"/><rect x="275" y="100" width="205" height="330" rx="20" fill="#EEF0FF" stroke="#5F6ED8" stroke-width="2"/><rect x="520" y="100" width="205" height="330" rx="20" fill="#E4F4F2" stroke="#16877F" stroke-width="2"/><rect x="765" y="100" width="205" height="330" rx="20" fill="#FFF4DC" stroke="#B7791F" stroke-width="2"/>
<text x="132" y="140" text-anchor="middle" class="head">disease biology</text><circle cx="132" cy="220" r="52" fill="white" stroke="#7A53EC" stroke-width="4"/><path d="M100 220C118 183 145 260 165 212" fill="none" stroke="#7A53EC" stroke-width="6"/><text x="132" y="310" text-anchor="middle" class="body">target is causal</text><text x="132" y="343" text-anchor="middle" class="small">genetics and perturbation</text><text x="132" y="370" text-anchor="middle" class="small">relevant patient context</text>
<path d="M240 265L268 265" class="arrow"/>
<text x="377" y="140" text-anchor="middle" class="head">molecular action</text><g stroke="#C8BBD8" stroke-width="5"><line x1="335" y1="210" x2="378" y2="180"/><line x1="378" y1="180" x2="421" y2="215"/><line x1="421" y1="215" x2="395" y2="260"/><line x1="395" y1="260" x2="345" y2="252"/><line x1="345" y1="252" x2="335" y2="210"/></g><g fill="#5F6ED8" stroke="white" stroke-width="3"><circle cx="335" cy="210" r="14"/><circle cx="378" cy="180" r="14"/><circle cx="421" cy="215" r="14"/><circle cx="395" cy="260" r="14"/><circle cx="345" cy="252" r="14"/></g><text x="377" y="310" text-anchor="middle" class="body">potent and selective</text><text x="377" y="343" text-anchor="middle" class="small">binding, cells, mechanism</text><text x="377" y="370" text-anchor="middle" class="small">reproducible chemistry</text>
<path d="M485 265L513 265" class="arrow"/>
<text x="622" y="140" text-anchor="middle" class="head">exposure</text><path d="M560 270C585 270 587 180 625 180C660 180 665 240 690 260" fill="none" stroke="#16877F" stroke-width="6"/><line x1="560" y1="278" x2="690" y2="278" stroke="#C8BBD8" stroke-width="2"/><text x="622" y="310" text-anchor="middle" class="body">right tissue and duration</text><text x="622" y="343" text-anchor="middle" class="small">absorption and clearance</text><text x="622" y="370" text-anchor="middle" class="small">free concentration</text>
<path d="M730 265L758 265" class="arrow"/>
<text x="867" y="140" text-anchor="middle" class="head">patient outcome</text><path d="M820 245L852 277L918 190" fill="none" stroke="#B7791F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="867" y="310" text-anchor="middle" class="body">benefit exceeds risk</text><text x="867" y="343" text-anchor="middle" class="small">clinical endpoints</text><text x="867" y="370" text-anchor="middle" class="small">defined population</text>
<rect x="135" y="475" width="730" height="50" rx="14" fill="#FCE8EE"/><text x="500" y="505" text-anchor="middle" class="body">strong evidence at one link does not validate the links downstream</text></svg>