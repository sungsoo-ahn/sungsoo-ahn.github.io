<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#665A75"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#231533}.title{font-size:22px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#665A75}.arrow{fill:none;stroke:#665A75;stroke-width:2.5;marker-end:url(#arr)}</style></defs><rect width="100%" height="100%" fill="white"/>
<text x="500" y="40" text-anchor="middle" class="title">Geometric attention separates invariant routing from equivariant content</text>
<rect x="35" y="80" width="210" height="390" rx="18" fill="#F2EDFF" stroke="#C8BBD8" stroke-width="2"/><rect x="285" y="80" width="430" height="390" rx="18" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/><rect x="755" y="80" width="210" height="390" rx="18" fill="#E4F4F2" stroke="#C8BBD8" stroke-width="2"/>
<text x="140" y="118" text-anchor="middle" class="head">typed inputs</text>
<circle cx="140" cy="178" r="32" fill="#7A53EC"/><text x="140" y="185" text-anchor="middle" font-size="18" fill="white">hᵢ</text>
<text x="140" y="238" text-anchor="middle" class="body">scalar ℓ = 0</text><rect x="85" y="256" width="110" height="25" rx="12" fill="#B7791F"/>
<text x="140" y="326" text-anchor="middle" class="body">vector ℓ = 1</text><path d="M105 380L180 345" stroke="#5F6ED8" stroke-width="6" marker-end="url(#arr)"/>
<text x="500" y="118" text-anchor="middle" class="head">query–key compatibility</text>
<rect x="320" y="145" width="160" height="83" rx="14" fill="white" stroke="#C8BBD8" stroke-width="2"/><rect x="520" y="145" width="160" height="83" rx="14" fill="white" stroke="#C8BBD8" stroke-width="2"/>
<text x="400" y="178" text-anchor="middle" class="body">qᵢ⁽ℓ⁾</text><text x="400" y="207" text-anchor="middle" class="small">typed query</text>
<text x="600" y="178" text-anchor="middle" class="body">kᵢⱼ⁽ℓ⁾</text><text x="600" y="207" text-anchor="middle" class="small">typed key</text>
<path d="M480 186L515 186" class="arrow"/>
<rect x="350" y="268" width="300" height="72" rx="18" fill="#FFF4DC" stroke="#B7791F" stroke-width="2"/>
<text x="500" y="298" text-anchor="middle" class="body">sᵢⱼ = Σℓ ⟨qᵢ⁽ℓ⁾, kᵢⱼ⁽ℓ⁾⟩</text><text x="500" y="325" text-anchor="middle" class="small">one rotation-invariant scalar</text>
<path d="M500 342L500 380" class="arrow"/><text x="500" y="413" text-anchor="middle" class="body">αᵢⱼ = softmaxⱼ(sᵢⱼ)</text><text x="500" y="442" text-anchor="middle" class="small">attention chooses how much, not how to rotate</text>
<text x="860" y="118" text-anchor="middle" class="head">typed output</text><text x="860" y="176" text-anchor="middle" class="body">Σⱼ αᵢⱼ vᵢⱼ⁽ℓ⁾</text>
<path d="M810 265L910 220" stroke="#16877F" stroke-width="7" marker-end="url(#arr)"/><path d="M810 325L910 370" stroke="#5F6ED8" stroke-width="7" marker-end="url(#arr)"/>
<text x="860" y="424" text-anchor="middle" class="small">each value keeps its type</text><path d="M715 275L750 275" class="arrow"/>
<rect x="180" y="495" width="640" height="42" rx="13" fill="#FCE8EE"/><text x="500" y="522" text-anchor="middle" class="body">invariant weight × equivariant value = equivariant message</text></svg>