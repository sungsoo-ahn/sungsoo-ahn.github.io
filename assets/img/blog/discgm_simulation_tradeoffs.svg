<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665A75"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7A53EC"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #231533; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 600; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #665A75; }
      .arrow { fill: none; stroke: #665A75; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
      .parrow { fill: none; stroke: #7A53EC; stroke-width: 4; stroke-linecap: round; marker-end: url(#purpleArrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="55" y="48" class="title" text-anchor="start">The same learned rates support different simulation budgets</text>
<rect x="45" y="90" width="530" height="370" rx="28" fill="#F6F2FA" stroke="#7A53EC" stroke-width="3"/>
<text x="310" y="132" class="label" text-anchor="middle">event-driven</text>
<text x="310" y="160" class="small" text-anchor="middle">sample the next jump time</text>
<line x1="110" y1="310" x2="510" y2="310" stroke="#C8BBD8" stroke-width="4" stroke-linecap="round"/>
<rect x="625" y="90" width="530" height="370" rx="28" fill="#E5F3EA" stroke="#3C8F63" stroke-width="3"/>
<text x="890" y="132" class="label" text-anchor="middle">fixed-step</text>
<text x="890" y="160" class="small" text-anchor="middle">approximate a short transition</text>
<line x1="690" y1="310" x2="1090" y2="310" stroke="#C8BBD8" stroke-width="4" stroke-linecap="round"/>
<line x1="125" y1="285" x2="125" y2="335" stroke="#B7791F" stroke-width="5" stroke-linecap="round"/>
<text x="125" y="370" class="label" text-anchor="middle">M</text>
<line x1="240" y1="285" x2="240" y2="335" stroke="#3C8F63" stroke-width="5" stroke-linecap="round"/>
<text x="240" y="370" class="label" text-anchor="middle">A</text>
<line x1="435" y1="285" x2="435" y2="335" stroke="#5F6ED8" stroke-width="5" stroke-linecap="round"/>
<text x="435" y="370" class="label" text-anchor="middle">B</text>
<text x="310" y="420" class="small" text-anchor="middle">exact events • sequential network calls</text>
<line x1="690" y1="287" x2="690" y2="333" stroke="#665A75" stroke-width="3"/>
<line x1="755" y1="287" x2="755" y2="333" stroke="#665A75" stroke-width="3"/>
<line x1="820" y1="287" x2="820" y2="333" stroke="#665A75" stroke-width="3"/>
<circle cx="820" cy="270" r="11" fill="#3C8F63"/>
<line x1="885" y1="287" x2="885" y2="333" stroke="#665A75" stroke-width="3"/>
<circle cx="885" cy="270" r="11" fill="#5F6ED8"/>
<line x1="950" y1="287" x2="950" y2="333" stroke="#665A75" stroke-width="3"/>
<line x1="1015" y1="287" x2="1015" y2="333" stroke="#665A75" stroke-width="3"/>
<circle cx="1015" cy="270" r="11" fill="#3C8F63"/>
<line x1="1080" y1="287" x2="1080" y2="333" stroke="#665A75" stroke-width="3"/>
<text x="890" y="370" class="small" text-anchor="middle">step size h</text>
<text x="890" y="420" class="small" text-anchor="middle">parallel updates • discretization bias</text>
<text x="600" y="515" class="body" text-anchor="middle">Smaller steps reduce bias but increase network evaluations; large exit rates force adaptive steps or event simulation.</text>
</svg>