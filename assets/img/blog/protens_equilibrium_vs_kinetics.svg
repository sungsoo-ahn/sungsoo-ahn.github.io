<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665A75"/></marker><marker id="parrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7A53EC"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#231533}.title{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:600}.body{font-size:17px}.small{font-size:15px;fill:#665A75}.arrow{fill:none;stroke:#665A75;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}.parrow{fill:none;stroke:#7A53EC;stroke-width:4;stroke-linecap:round;marker-end:url(#parrow)}</style></defs><rect width="100%" height="100%" fill="white"/><text x="55" y="48" class="title" text-anchor="start">Matching equilibrium populations does not determine kinetics</text>
<rect x="45" y="90" width="530" height="370" rx="28" fill="#E5F3EA" stroke="#3C8F63" stroke-width="3"/>
<text x="310" y="132" class="label" text-anchor="middle">reference dynamics</text>
<rect x="625" y="90" width="530" height="370" rx="28" fill="#FCE8EE" stroke="#C7506B" stroke-width="3"/>
<text x="890" y="132" class="label" text-anchor="middle">fast surrogate</text>
<circle cx="175" cy="270" r="62" fill="white" stroke="#5F6ED8" stroke-width="4"/>
<text x="175" y="277" class="label" text-anchor="middle">A</text>
<circle cx="445" cy="270" r="62" fill="white" stroke="#B7791F" stroke-width="4"/>
<text x="445" y="277" class="label" text-anchor="middle">B</text>
<path d="M245,260 L375,260" class="arrow"/>
<text x="310" y="390" class="small" text-anchor="middle">rare barrier crossings</text>
<text x="310" y="180" class="small" text-anchor="middle">50% A • 50% B</text>
<circle cx="755" cy="270" r="62" fill="white" stroke="#5F6ED8" stroke-width="4"/>
<text x="755" y="277" class="label" text-anchor="middle">A</text>
<circle cx="1025" cy="270" r="62" fill="white" stroke="#B7791F" stroke-width="4"/>
<text x="1025" y="277" class="label" text-anchor="middle">B</text>
<path d="M825,245 L955,245" class="parrow"/>
<path d="M955,300 L825,300" class="parrow"/>
<text x="890" y="390" class="small" text-anchor="middle">many rapid switches</text>
<text x="890" y="180" class="small" text-anchor="middle">50% A • 50% B</text>
<text x="600" y="515" class="body" text-anchor="middle">The two models share the same stationary distribution but disagree on relaxation time and pathway statistics.</text></svg>