<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#665A75"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A53EC"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #231533; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 600; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #665A75; }
      .edge { fill: none; stroke: #C8BBD8; stroke-width: 4; stroke-linecap: round; }
      .axis { fill: none; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
      .arrow { fill: none; stroke: #665A75; stroke-width: 3; marker-end: url(#arrow); }
      .parrow { fill: none; stroke: #7A53EC; stroke-width: 3; marker-end: url(#purpleArrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="60" y="48" class="title" text-anchor="start">A local frame converts geometric vectors into invariant coordinates</text>
<circle cx="225" cy="285" r="15" fill="#231533" stroke="white" stroke-width="3"/>
<line x1="225" y1="285" x2="370" y2="260" stroke="#7A53EC" class="axis"/>
<line x1="225" y1="285" x2="180" y2="160" stroke="#16877F" class="axis"/>
<line x1="225" y1="285" x2="285" y2="400" stroke="#B7791F" class="axis"/>
<text x="385" y="255" class="label" text-anchor="middle">e₁</text>
<text x="170" y="145" class="label" text-anchor="middle">e₂</text>
<text x="295" y="420" class="label" text-anchor="middle">e₃</text>
<line x1="225" y1="285" x2="285" y2="190" stroke="#C7506B" stroke-width="6" marker-end="url(#arrow)"/>
<text x="300" y="175" class="label" text-anchor="middle">v</text>
<text x="225" y="470" class="small" text-anchor="middle">frame from two non-collinear relative vectors</text>
<path d="M420,285 L520,285" class="parrow"/>
<rect x="540" y="160" width="220" height="250" rx="28" fill="#F6F2FA" stroke="#7A53EC" stroke-width="3"/>
<text x="650" y="202" class="label" text-anchor="middle">scalarize</text>
<text x="650" y="252" class="body" text-anchor="middle">s₁ = v·e₁</text>
<text x="650" y="292" class="body" text-anchor="middle">s₂ = v·e₂</text>
<text x="650" y="332" class="body" text-anchor="middle">s₃ = v·e₃</text>
<text x="650" y="375" class="small" text-anchor="middle">ordinary nonlinear network</text>
<path d="M780,285 L870,285" class="parrow"/>
<rect x="890" y="160" width="250" height="250" rx="28" fill="#E5F3EA" stroke="#3C8F63" stroke-width="3"/>
<text x="1015" y="202" class="label" text-anchor="middle">vectorize</text>
<text x="1015" y="260" class="body" text-anchor="middle">v′ = a₁e₁ + a₂e₂ + a₃e₃</text>
<line x1="960" y1="350" x2="1065" y2="315" stroke="#3C8F63" stroke-width="7" marker-end="url(#arrow)"/>
<text x="1015" y="390" class="small" text-anchor="middle">output rotates with the frame</text>
<text x="600" y="515" class="body" text-anchor="middle">Dot products are rotation invariant because the vector and every frame axis rotate together.</text>
</svg>