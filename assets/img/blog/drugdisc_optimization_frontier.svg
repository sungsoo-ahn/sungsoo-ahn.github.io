<g fill="#5F6ED8" stroke="white" stroke-width="3"><circle cx="175" cy="350" r="14"/><circle cx="240" cy="315" r="14"/><circle cx="305" cy="275" r="14"/><circle cx="370" cy="232" r="14"/><circle cx="440" cy="188" r="14"/><circle cx="520" cy="156" r="14"/></g>
<g fill="#C7506B" stroke="white" stroke-width="3"><circle cx="270" cy="390" r="12"/><circle cx="415" cy="342" r="12"/><circle cx="525" cy="300" r="12"/></g><text x="330" y="115" text-anchor="middle" class="head">constrained Pareto frontier</text><text x="335" y="475" text-anchor="middle" class="small">red candidates fail solubility, clearance, selectivity, or synthesis constraints</text>
<text x="810" y="125" text-anchor="middle" class="head">a viable lead</text><rect x="705" y="155" width="210" height="48" rx="13" fill="white"/><text x="810" y="185" text-anchor="middle" class="body">potent enough</text><rect x="705" y="220" width="210" height="48" rx="13" fill="white"/><text x="810" y="250" text-anchor="middle" class="body">soluble and stable</text><rect x="705" y="285" width="210" height="48" rx="13" fill="white"/><text x="810" y="315" text-anchor="middle" class="body">selective and safe</text><rect x="705" y="350" width="210" height="48" rx="13" fill="white"/><text x="810" y="380" text-anchor="middle" class="body">practical to make</text><text x="810" y="440" text-anchor="middle" class="small">thresholds depend on dose and indication</text></svg>