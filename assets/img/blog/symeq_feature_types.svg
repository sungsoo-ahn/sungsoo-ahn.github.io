<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#665A75"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #231533; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 600; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #665A75; }
      .arrow { stroke: #665A75; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  
      <text x="480" y="42" text-anchor="middle" class="title">A feature type is a rule for how values transform</text>
      <rect x="55" y="95" width="250" height="300" rx="18" fill="#F6F2FA" stroke="#C8BBD8" stroke-width="2"/>
      <text x="180" y="132" text-anchor="middle" class="label">Scalar</text>
      <circle cx="180" cy="225" r="56" fill="white" stroke="#7A53EC" stroke-width="3"/>
      <text x="180" y="234" text-anchor="middle" font-size="28" font-weight="700">3.7</text>
      <path d="M 127 315 C 150 345, 210 345, 233 315" class="arrow"/>
      <text x="180" y="375" text-anchor="middle" class="small">unchanged by rotation</text>

      <rect x="355" y="95" width="250" height="300" rx="18" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/>
      <text x="480" y="132" text-anchor="middle" class="label">Vector</text>
      <circle cx="480" cy="245" r="5" fill="#231533"/>
      <path d="M 480 245 L 480 165" stroke="#5F6ED8" stroke-width="5" marker-end="url(#arrow)"/>
      <path d="M 480 245 L 548 205" stroke="#16877F" stroke-width="5" marker-end="url(#arrow)"/>
      <path d="M 495 181 A 70 70 0 0 1 538 215" fill="none" stroke="#665A75" stroke-width="2"/>
      <text x="480" y="375" text-anchor="middle" class="small">direction rotates with the input</text>

      <rect x="655" y="95" width="250" height="300" rx="18" fill="#E4F4F2" stroke="#C8BBD8" stroke-width="2"/>
      <text x="780" y="132" text-anchor="middle" class="label">Steerable feature</text>
      <path d="M 705 250 C 730 160, 755 160, 780 250 S 830 340, 855 250" fill="none" stroke="#5F6ED8" stroke-width="4"/>
      <path d="M 705 250 C 730 340, 755 340, 780 250 S 830 160, 855 250" fill="none" stroke="#16877F" stroke-width="4"/>
      <text x="780" y="330" text-anchor="middle" class="body">[a, b] → D(g)[a, b]</text>
      <text x="780" y="375" text-anchor="middle" class="small">components mix by a representation</text>
    
</svg>