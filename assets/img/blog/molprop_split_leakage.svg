<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#665A75"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#231533}.title{font-size:22px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#665A75}.arrow{fill:none;stroke:#665A75;stroke-width:2.5;marker-end:url(#arr)}</style></defs><rect width="100%" height="100%" fill="white"/>
<text x="500" y="40" text-anchor="middle" class="title">A split defines the kind of generalization being measured</text><rect x="45" y="82" width="420" height="370" rx="20" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/><rect x="535" y="82" width="420" height="370" rx="20" fill="#E4F4F2" stroke="#C8BBD8" stroke-width="2"/>
<text x="255" y="122" text-anchor="middle" class="head">random split</text><circle cx="120" cy="175" r="15" fill="#7A53EC" stroke="white" stroke-width="3"/><circle cx="165" cy="200" r="15" fill="#7A53EC" stroke="white" stroke-width="3"/><circle cx="105" cy="235" r="15" fill="#7A53EC" stroke="white" stroke-width="3"/><circle cx="175" cy="265" r="15" fill="#7A53EC" stroke="white" stroke-width="3"/><circle cx="255" cy="180" r="15" fill="#16877F" stroke="white" stroke-width="3"/><circle cx="290" cy="225" r="15" fill="#16877F" stroke="white" stroke-width="3"/><circle cx="250" cy="270" r="15" fill="#16877F" stroke="white" stroke-width="3"/><circle cx="365" cy="180" r="15" fill="#5F6ED8" stroke="white" stroke-width="3"/><circle cx="405" cy="225" r="15" fill="#5F6ED8" stroke="white" stroke-width="3"/><circle cx="370" cy="275" r="15" fill="#5F6ED8" stroke="white" stroke-width="3"/><line x1="80" y1="315" x2="430" y2="315" stroke="#C7506B" stroke-width="3" stroke-dasharray="8 7"/><text x="255" y="350" text-anchor="middle" class="body">related scaffolds cross the boundary</text><text x="255" y="382" text-anchor="middle" class="small">good for interpolation within a library</text><text x="255" y="410" text-anchor="middle" class="small">optimistic for scaffold discovery</text>
<text x="745" y="122" text-anchor="middle" class="head">scaffold / temporal split</text><circle cx="610" cy="175" r="15" fill="#7A53EC" stroke="white" stroke-width="3"/><circle cx="650" cy="205" r="15" fill="#7A53EC" stroke="white" stroke-width="3"/><circle cx="600" cy="245" r="15" fill="#7A53EC" stroke="white" stroke-width="3"/><circle cx="665" cy="270" r="15" fill="#7A53EC" stroke="white" stroke-width="3"/><circle cx="750" cy="180" r="15" fill="#16877F" stroke="white" stroke-width="3"/><circle cx="790" cy="225" r="15" fill="#16877F" stroke="white" stroke-width="3"/><circle cx="750" cy="270" r="15" fill="#16877F" stroke="white" stroke-width="3"/><circle cx="865" cy="180" r="15" fill="#5F6ED8" stroke="white" stroke-width="3"/><circle cx="905" cy="225" r="15" fill="#5F6ED8" stroke="white" stroke-width="3"/><circle cx="870" cy="275" r="15" fill="#5F6ED8" stroke="white" stroke-width="3"/><rect x="575" y="145" width="115" height="160" rx="18" fill="none" stroke="#7A53EC" stroke-width="3"/><rect x="710" y="145" width="105" height="160" rx="18" fill="none" stroke="#16877F" stroke-width="3"/><rect x="835" y="145" width="105" height="160" rx="18" fill="none" stroke="#5F6ED8" stroke-width="3"/>
<text x="745" y="350" text-anchor="middle" class="body">families or acquisition eras stay intact</text><text x="745" y="382" text-anchor="middle" class="small">harder, but closer to prospective use</text><text x="745" y="410" text-anchor="middle" class="small">duplicates must be resolved first</text>
<rect x="155" y="486" width="690" height="48" rx="14" fill="#FFF4DC"/><text x="500" y="507" text-anchor="middle" class="body">the same predictions can support different claims under different splits</text><text x="500" y="527" text-anchor="middle" class="small">split molecules—not rows, conformers, or repeated measurements</text></svg>