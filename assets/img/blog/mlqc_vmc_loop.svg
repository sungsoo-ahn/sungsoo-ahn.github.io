<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#665A75"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#231533}.title{font-size:22px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#665A75}.arrow{fill:none;stroke:#665A75;stroke-width:2.5;marker-end:url(#arr)}</style></defs><rect width="100%" height="100%" fill="white"/>
<text x="500" y="40" text-anchor="middle" class="title">A neural wavefunction is optimized through variational Monte Carlo</text><rect x="50" y="82" width="900" height="375" rx="20" fill="#F2EDFF" stroke="#C8BBD8" stroke-width="2"/>
<rect x="90" y="155" width="185" height="105" rx="20" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/><text x="182" y="191" text-anchor="middle" class="head">antisymmetric</text><text x="182" y="223" text-anchor="middle" class="body">psi_theta(r)</text>
