<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#665A75"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #231533; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 600; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #665A75; }
      .arrow { stroke: #665A75; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  
      <text x="480" y="42" text-anchor="middle" class="title">Architectural symmetry removes functions that contradict the data geometry</text>
      <ellipse cx="455" cy="245" rx="355" ry="165" fill="#EEF0FF" stroke="#5F6ED8" stroke-width="3"/>
      <text x="240" y="125" text-anchor="middle" class="label">all functions the network can express</text>
      <path d="M 205 280 C 255 170, 315 330, 370 215 S 475 305, 535 190" fill="none" stroke="#C8BBD8" stroke-width="3"/>
      <path d="M 160 325 C 245 245, 315 360, 395 275" fill="none" stroke="#C8BBD8" stroke-width="3"/>
      <ellipse cx="600" cy="258" rx="170" ry="105" fill="#F6F2FA" stroke="#7A53EC" stroke-width="3"/>
      <text x="600" y="232" text-anchor="middle" class="label">equivariant functions</text>
      <text x="600" y="264" text-anchor="middle" class="body">f(ρₓ(g)x) = ρᵧ(g)f(x)</text>
      <text x="600" y="294" text-anchor="middle" class="small">one prediction constrains an entire orbit</text>
      <path d="M 826 190 C 900 210, 900 300, 827 320" class="arrow"/>
      <text x="875" y="167" text-anchor="middle" class="small">built-in constraint</text>
      <rect x="210" y="435" width="540" height="42" rx="12" fill="#FFF4DC"/>
      <text x="480" y="462" text-anchor="middle" class="body">less freedom can improve generalization when the symmetry is correct</text>
    
</svg>