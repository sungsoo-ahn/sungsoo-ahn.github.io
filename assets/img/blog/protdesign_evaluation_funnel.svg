<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#665A75"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#231533}.title{font-size:22px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#665A75}.arrow{stroke:#665A75;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs><rect width="100%" height="100%" fill="white"/><text x="500" y="42" text-anchor="middle" class="title">Every filter changes the population on which success is measured</text>
    <path d="M110 105H890L760 185H240Z" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/><text x="500" y="145" text-anchor="middle" class="body">10,000 generated candidates — diversity and novelty</text>
    <path d="M240 195H760L675 275H325Z" fill="#F6F2FA" stroke="#C8BBD8" stroke-width="2"/><text x="500" y="237" text-anchor="middle" class="body">2,000 geometry-valid — clashes, bonds, topology</text>
    <path d="M325 285H675L620 365H380Z" fill="#E4F4F2" stroke="#C8BBD8" stroke-width="2"/><text x="500" y="327" text-anchor="middle" class="body">300 self-consistent — sequence refolds</text>
    <path d="M380 375H620L570 455H430Z" fill="#FFF4DC" stroke="#C8BBD8" stroke-width="2"/><text x="500" y="417" text-anchor="middle" class="body">24 synthesized — ranked by oracles</text>
    <rect x="450" y="475" width="100" height="48" rx="14" fill="#FCE8EE" stroke="#C7506B" stroke-width="2"/><text x="500" y="506" text-anchor="middle" class="body">3 hits</text>
    <path d="M795 215C915 260,915 425,775 480" fill="none" stroke="#C7506B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="850" y="302" text-anchor="middle" class="small">selection bias</text><text x="850" y="327" text-anchor="middle" class="small">the assay sees only</text><text x="850" y="352" text-anchor="middle" class="small">the oracle's favorites</text>
    <text x="175" y="487" text-anchor="middle" class="small">Report denominator, filters,</text><text x="175" y="511" text-anchor="middle" class="small">controls, and negative outcomes.</text></svg>