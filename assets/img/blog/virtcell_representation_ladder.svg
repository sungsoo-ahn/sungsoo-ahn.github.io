<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#665A75"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#231533}.title{font-size:22px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#665A75}.arrow{fill:none;stroke:#665A75;stroke-width:2.5;marker-end:url(#arr)}.line{fill:none;stroke:#C8BBD8;stroke-width:4;stroke-linecap:round}</style></defs><rect width="100%" height="100%" fill="white"/>
<text x="500" y="40" text-anchor="middle" class="title">A virtual cell needs more than a larger genomic language model</text>
<rect x="35" y="92" width="205" height="340" rx="20" fill="#F2EDFF" stroke="#C8BBD8" stroke-width="2"/><rect x="275" y="92" width="205" height="340" rx="20" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/><rect x="520" y="92" width="205" height="340" rx="20" fill="#E4F4F2" stroke="#C8BBD8" stroke-width="2"/><rect x="760" y="92" width="205" height="340" rx="20" fill="#FFF4DC" stroke="#C8BBD8" stroke-width="2"/>
<text x="137" y="132" text-anchor="middle" class="head">DNA / RNA</text><path d="M72 195C100 155 128 235 158 195C185 155 205 225 215 245" class="line" stroke="#7A53EC"/><text x="137" y="280" text-anchor="middle" class="body">sequence context</text><text x="137" y="310" text-anchor="middle" class="small">motifs and variants</text><text x="137" y="340" text-anchor="middle" class="small">one molecular layer</text>
<text x="377" y="132" text-anchor="middle" class="head">regulatory state</text><g fill="#5F6ED8"><rect x="315" y="190" width="18" height="65" rx="7"/><rect x="345" y="165" width="18" height="90" rx="7"/><rect x="375" y="210" width="18" height="45" rx="7"/><rect x="405" y="145" width="18" height="110" rx="7"/><rect x="435" y="188" width="18" height="67" rx="7"/></g><text x="377" y="280" text-anchor="middle" class="body">chromatin + expression</text><text x="377" y="310" text-anchor="middle" class="small">cell-type dependent</text><text x="377" y="340" text-anchor="middle" class="small">assay dependent</text>
<text x="622" y="132" text-anchor="middle" class="head">cell state</text><circle cx="622" cy="214" r="73" fill="white" stroke="#16877F" stroke-width="5"/><circle cx="622" cy="214" r="28" fill="#E4F4F2" stroke="#16877F" stroke-width="3"/><circle cx="580" cy="185" r="8" fill="#7A53EC"/><circle cx="660" cy="245" r="8" fill="#B7791F"/><text x="622" y="310" text-anchor="middle" class="body">multi-omic snapshot</text><text x="622" y="340" text-anchor="middle" class="small">context and uncertainty</text>
<text x="862" y="132" text-anchor="middle" class="head">virtual cell</text><circle cx="862" cy="205" r="58" fill="white" stroke="#B7791F" stroke-width="4"/><path d="M820 205C842 165 874 255 905 190" fill="none" stroke="#C7506B" stroke-width="6"/><path d="M862 145A60 60 0 0 1 918 205" class="arrow"/><text x="862" y="290" text-anchor="middle" class="body">predict interventions</text><text x="862" y="320" text-anchor="middle" class="small">across time and context</text><text x="862" y="350" text-anchor="middle" class="small">with calibrated distributions</text>
