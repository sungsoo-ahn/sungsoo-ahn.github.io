<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665A75"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7A53EC"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #231533; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 600; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #665A75; }
      .arrow { fill: none; stroke: #665A75; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
      .parrow { fill: none; stroke: #7A53EC; stroke-width: 4; stroke-linecap: round; marker-end: url(#purpleArrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="55" y="48" class="title" text-anchor="start">A continuous-time chain is specified by rates, not step probabilities</text>
<rect x="45" y="90" width="620" height="385" rx="30" fill="#F6F2FA" stroke="#7A53EC" stroke-width="3"/>
<text x="355" y="130" class="label" text-anchor="middle">three-state generator</text>
<circle cx="175" cy="285" r="56" fill="#FFF4DC" stroke="#B7791F" stroke-width="4"/><text x="175" y="292" class="label" text-anchor="middle">MASK</text>
<circle cx="465" cy="205" r="48" fill="#E5F3EA" stroke="#3C8F63" stroke-width="4"/><text x="465" y="212" class="label" text-anchor="middle">A</text>
<circle cx="465" cy="365" r="48" fill="#EEF0FF" stroke="#5F6ED8" stroke-width="4"/><text x="465" y="372" class="label" text-anchor="middle">B</text>
<path d="M230,263 C305,225 345,211 408,207" class="parrow"/>
<path d="M229,307 C300,348 345,365 408,365" class="parrow"/>
<text x="315" y="213" class="small" text-anchor="middle">q(A | M)</text>
<text x="318" y="374" class="small" text-anchor="middle">q(B | M)</text>
<text x="355" y="440" class="small" text-anchor="middle">exit rate λ(M) = q(A | M) + q(B | M)</text>
<rect x="710" y="90" width="445" height="385" rx="30" fill="white" stroke="#C8BBD8" stroke-width="3"/>
<text x="932" y="130" class="label" text-anchor="middle">probability balance</text>
<circle cx="770" cy="150" r="15" fill="#B7791F"/>
<text x="803" y="156" class="label" text-anchor="start">MASK</text>
<text x="1110" y="155" class="small" text-anchor="end">outgoing</text>
<circle cx="770" cy="235" r="15" fill="#3C8F63"/>
<text x="803" y="241" class="label" text-anchor="start">A</text>
<text x="1110" y="240" class="small" text-anchor="end">incoming</text>
<circle cx="770" cy="320" r="15" fill="#5F6ED8"/>
<text x="803" y="326" class="label" text-anchor="start">B</text>
<text x="1110" y="325" class="small" text-anchor="end">incoming</text>
<line x1="765" y1="385" x2="1095" y2="385" stroke="#C8BBD8" stroke-width="3" stroke-linecap="round"/>
<text x="930" y="425" class="label" text-anchor="middle">inflow − outflow</text>
<text x="600" y="525" class="body" text-anchor="middle">The diagonal generator entry is minus the total exit rate, so every generator column sums to zero.</text>
</svg>