<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#665A75"/>
    </marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A53EC"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #231533; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 600; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #665A75; }
      .edge { stroke: #C8BBD8; stroke-width: 5; stroke-linecap: round; }
      .arrow { stroke: #665A75; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="70" y="50" class="title" text-anchor="start">Two derivations impose different symmetries—and therefore answer different questions</text>
<rect x="50" y="88" width="520" height="340" rx="28" fill="#F6F2FA" stroke="#7A53EC" stroke-width="3"/>
<rect x="630" y="88" width="520" height="340" rx="28" fill="#EEF0FF" stroke="#5F6ED8" stroke-width="3"/>
<text x="310" y="130" class="label" text-anchor="middle">Fixed graph: commute with its Laplacian</text>
<text x="890" y="130" class="label" text-anchor="middle">Varying graphs: commute with every relabeling</text>
<line x1="125" y1="230" x2="205" y2="175" class="edge"/>
<line x1="205" y1="175" x2="290" y2="230" class="edge"/>
<line x1="290" y1="230" x2="220" y2="310" class="edge"/>
<line x1="220" y1="310" x2="125" y2="230" class="edge"/>
<line x1="205" y1="175" x2="220" y2="310" class="edge"/>
<circle cx="125" cy="230" r="25" fill="#F2EDFF" stroke="#7A53EC" stroke-width="4"/><text x="125" y="237" class="label" text-anchor="middle">1</text>
<circle cx="205" cy="175" r="25" fill="#F2EDFF" stroke="#7A53EC" stroke-width="4"/><text x="205" y="182" class="label" text-anchor="middle">2</text>
<circle cx="290" cy="230" r="25" fill="#F2EDFF" stroke="#7A53EC" stroke-width="4"/><text x="290" y="237" class="label" text-anchor="middle">3</text>
<circle cx="220" cy="310" r="25" fill="#F2EDFF" stroke="#7A53EC" stroke-width="4"/><text x="220" y="317" class="label" text-anchor="middle">4</text>
<path d="M 325 245 L 405 245" stroke="#7A53EC" stroke-width="3" fill="none" marker-end="url(#purple-arrow)"/>
<rect x="420" y="180" width="110" height="130" rx="24" fill="#FFF4DC" stroke="#B7791F" stroke-width="3"/>
<text x="475" y="218" class="label" text-anchor="middle">h(L)</text>
<text x="475" y="253" class="small" text-anchor="middle">spectral</text>
<text x="475" y="278" class="small" text-anchor="middle">filter</text>
<text x="310" y="365" class="body" text-anchor="middle">Eigenvalues define frequency; polynomials in L become local.</text>
<text x="310" y="397" class="small" text-anchor="middle">The basis depends on this particular graph.</text>
<rect x="690" y="183" width="28" height="60" rx="9" fill="#7A53EC"/>
<rect x="729" y="183" width="28" height="72" rx="9" fill="#B7791F"/>
<rect x="768" y="183" width="28" height="84" rx="9" fill="#16877F"/>
<rect x="807" y="183" width="28" height="96" rx="9" fill="#5F6ED8"/>
<path d="M 850 240 L 925 240" stroke="#7A53EC" stroke-width="3" fill="none" marker-end="url(#purple-arrow)"/>
<rect x="945" y="170" width="155" height="145" rx="26" fill="#E5F3EA" stroke="#3C8F63" stroke-width="3"/>
<text x="1022" y="210" class="label" text-anchor="middle">αI + β11ᵀ</text>
<text x="1022" y="248" class="small" text-anchor="middle">keep each node</text>
<text x="1022" y="275" class="small" text-anchor="middle">+ pool globally</text>
<text x="890" y="365" class="body" text-anchor="middle">The fixed-point space gives all equivariant linear maps.</text>
<text x="890" y="397" class="small" text-anchor="middle">Adjacency enters only through an extra equivariant product AX.</text>
<rect x="300" y="452" width="600" height="50" rx="18" fill="#FFF4DC" stroke="#B7791F" stroke-width="3"/>
<text x="600" y="484" class="label" text-anchor="middle">Message passing combines shared node maps with the graph-dependent product AX.</text>
</svg>