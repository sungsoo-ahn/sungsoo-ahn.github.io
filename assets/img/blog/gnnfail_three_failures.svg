<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#665A75"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #231533; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #665A75; }
      .edge { stroke: #C8BBD8; stroke-width: 4; stroke-linecap: round; }
      .arrow { stroke: #665A75; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  
      <text x="500" y="42" text-anchor="middle" class="title">Depth fixes reach, then creates two different information failures</text>
      <rect x="30" y="82" width="295" height="410" rx="20" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/><text x="177.5" y="122" text-anchor="middle" class="label">Under-reaching</text>
      <rect x="352" y="82" width="295" height="410" rx="20" fill="#F6F2FA" stroke="#C8BBD8" stroke-width="2"/><text x="499.5" y="122" text-anchor="middle" class="label">Over-smoothing</text>
      <rect x="675" y="82" width="295" height="410" rx="20" fill="#FCE8EE" stroke="#C8BBD8" stroke-width="2"/><text x="822.5" y="122" text-anchor="middle" class="label">Over-squashing</text>

      <line x1="95" y1="245" x2="160" y2="245" stroke="#C8BBD8" stroke-width="4" stroke-linecap="round"/><line x1="160" y1="245" x2="225" y2="245" stroke="#C8BBD8" stroke-width="4" stroke-linecap="round"/>
      <circle cx="95" cy="245" r="12" fill="#B7791F" stroke="white" stroke-width="3"/><circle cx="160" cy="245" r="12" fill="#C8BBD8" stroke="white" stroke-width="3"/><circle cx="225" cy="245" r="12" fill="#16877F" stroke="white" stroke-width="3"/>
      <path d="M 100 210 L 154 210" class="arrow"/>
      <text x="177" y="330" text-anchor="middle" class="body">too few layers</text>
      <text x="177" y="356" text-anchor="middle" class="small">the target lies outside the</text>
      <text x="177" y="377" text-anchor="middle" class="small">current receptive field</text>

      <line x1="444.75" y1="245" x2="500" y2="198.25" stroke="#C8BBD8" stroke-width="3" stroke-linecap="round"/><line x1="500" y1="198.25" x2="555.25" y2="245" stroke="#C8BBD8" stroke-width="3" stroke-linecap="round"/><line x1="555.25" y1="245" x2="500" y2="291.75" stroke="#C8BBD8" stroke-width="3" stroke-linecap="round"/><line x1="500" y1="291.75" x2="444.75" y2="245" stroke="#C8BBD8" stroke-width="3" stroke-linecap="round"/><line x1="444.75" y1="245" x2="555.25" y2="245" stroke="#C8BBD8" stroke-width="3" stroke-linecap="round"/><circle cx="444.75" cy="245" r="11" fill="#7A53EC" stroke="white" stroke-width="3"/><circle cx="500" cy="198.25" r="11" fill="#7A53EC" stroke="white" stroke-width="3"/><circle cx="555.25" cy="245" r="11" fill="#7A53EC" stroke="white" stroke-width="3"/><circle cx="500" cy="291.75" r="11" fill="#7A53EC" stroke="white" stroke-width="3"/>
      <circle cx="500" cy="245" r="76" fill="none" stroke="#7A53EC" stroke-width="2" stroke-dasharray="7 7"/>
      <text x="500" y="340" text-anchor="middle" class="body">too much repeated mixing</text>
      <text x="500" y="366" text-anchor="middle" class="small">node representations lose</text>
      <text x="500" y="387" text-anchor="middle" class="small">task-relevant contrast</text>

      <circle cx="735" cy="180" r="12" fill="#5F6ED8" stroke="white" stroke-width="3"/><circle cx="735" cy="230" r="12" fill="#5F6ED8" stroke="white" stroke-width="3"/><circle cx="735" cy="280" r="12" fill="#5F6ED8" stroke="white" stroke-width="3"/><circle cx="735" cy="330" r="12" fill="#5F6ED8" stroke="white" stroke-width="3"/>
      <circle cx="820" cy="255" r="15" fill="#B7791F" stroke="white" stroke-width="3"/>
      <circle cx="910" cy="255" r="18" fill="#16877F" stroke="white" stroke-width="3"/>
      <line x1="735" y1="180" x2="820" y2="255" stroke="#C8BBD8" stroke-width="4" stroke-linecap="round"/><line x1="735" y1="230" x2="820" y2="255" stroke="#C8BBD8" stroke-width="4" stroke-linecap="round"/><line x1="735" y1="280" x2="820" y2="255" stroke="#C8BBD8" stroke-width="4" stroke-linecap="round"/><line x1="735" y1="330" x2="820" y2="255" stroke="#C8BBD8" stroke-width="4" stroke-linecap="round"/><line x1="820" y1="255" x2="910" y2="255" stroke="#C7506B" stroke-width="7" stroke-linecap="round"/>
      <text x="823" y="345" text-anchor="middle" class="body">too much compression</text>
      <text x="823" y="371" text-anchor="middle" class="small">many distant signals cross</text>
      <text x="823" y="392" text-anchor="middle" class="small">a narrow topological cut</text>
    
</svg>