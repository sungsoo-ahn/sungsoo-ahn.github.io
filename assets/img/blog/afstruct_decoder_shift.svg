<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#665A75"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #231533; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #665A75; }
      .arrow { stroke: #665A75; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>

      <text x="500" y="42" text-anchor="middle" class="title">The decisive shift is how learned geometry becomes coordinates</text>
      <rect x="35" y="90" width="290" height="390" rx="20" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/>
      <text x="180" y="130" text-anchor="middle" class="label">AlphaFold 1</text>
      <rect x="78" y="163" width="204" height="70" rx="15" fill="white" stroke="#5F6ED8" stroke-width="2"/>
      <text x="180" y="190" text-anchor="middle" class="body">distograms and torsions</text>
      <text x="180" y="216" text-anchor="middle" class="small">learn pairwise potentials</text>
      <path d="M 180 243 L 180 286" class="arrow"/>
      <path d="M 85 355 C 120 290, 230 300, 270 360" fill="none" stroke="#7A53EC" stroke-width="7" stroke-linecap="round"/>
      <text x="180" y="405" text-anchor="middle" class="body">optimize coordinates</text>
      <text x="180" y="433" text-anchor="middle" class="small">network plus external solver</text>

      <rect x="355" y="90" width="290" height="390" rx="20" fill="#F6F2FA" stroke="#C8BBD8" stroke-width="2"/>
      <text x="500" y="130" text-anchor="middle" class="label">AlphaFold 2</text>
      <g transform="translate(500 220)"><line x1="0" y1="0" x2="58" y2="0" stroke="#C7506B" stroke-width="5"/><line x1="0" y1="0" x2="0" y2="-58" stroke="#16877F" stroke-width="5"/><circle cx="0" cy="0" r="9" fill="#231533"/></g>
      <g transform="translate(500 330) rotate(35)"><line x1="0" y1="0" x2="58" y2="0" stroke="#C7506B" stroke-width="5"/><line x1="0" y1="0" x2="0" y2="-58" stroke="#16877F" stroke-width="5"/><circle cx="0" cy="0" r="9" fill="#231533"/></g>
      <path d="M 500 245 L 500 286" class="arrow"/>
      <text x="500" y="405" text-anchor="middle" class="body">iterative residue frames</text>
      <text x="500" y="433" text-anchor="middle" class="small">end-to-end coordinate refinement</text>

      <rect x="675" y="90" width="290" height="390" rx="20" fill="#E4F4F2" stroke="#C8BBD8" stroke-width="2"/>
      <text x="820" y="130" text-anchor="middle" class="label">AlphaFold 3</text>
      <circle cx="820" cy="230" r="83" fill="white" stroke="#5F6ED8" stroke-width="3" stroke-dasharray="7 6"/>
      <circle cx="786" cy="205" r="11" fill="#7A53EC"/><circle cx="842" cy="190" r="11" fill="#C7506B"/><circle cx="860" cy="246" r="11" fill="#B7791F"/><circle cx="800" cy="267" r="11" fill="#16877F"/>
      <path d="M 786 205 L 842 190 L 860 246 L 800 267 Z" fill="none" stroke="#665A75" stroke-width="3"/>
      <path d="M 820 323 L 820 350" class="arrow"/>
      <text x="820" y="386" text-anchor="middle" class="body">denoise raw atom coordinates</text>
      <text x="820" y="414" text-anchor="middle" class="small">one decoder for mixed complexes</text>
      <text x="820" y="441" text-anchor="middle" class="small">protein, nucleic acid, ligand, ion</text>

      <rect x="160" y="505" width="680" height="38" rx="12" fill="#FFF4DC"/>
      <text x="500" y="530" text-anchor="middle" class="body">All three learn pair geometry; they differ in the inductive bias of coordinate construction.</text>

</svg>