   <g id="text_17">
    <text style="font-size: 10px; font-family: 'Arial'; text-anchor: middle; fill: #665a75" x="424.863404" y="202.9959" transform="rotate(-0 424.863404 202.9959)">After two layers, v can depend on nodes up to two hops away.</text>
