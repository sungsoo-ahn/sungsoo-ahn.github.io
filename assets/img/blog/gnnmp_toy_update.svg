   </g>
   <g id="text_14">
    <text style="font-weight: 600; font-size: 9.6px; font-family: 'Arial'; text-anchor: middle; fill: #b7791f" x="524.727487" y="87.6213" transform="rotate(-0 524.727487 87.6213)">update</text>
