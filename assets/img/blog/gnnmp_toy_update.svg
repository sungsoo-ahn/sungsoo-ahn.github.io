   <g id="text_16">
    <text style="font-size: 10px; font-family: 'Arial'; text-anchor: middle; fill: #231533" x="424.863404" y="169.651162" transform="rotate(-0 424.863404 169.651162)">Reordering the three incoming messages does not change the sum.</text>
