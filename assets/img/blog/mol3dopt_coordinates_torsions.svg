<text x="890" y="132" class="label" text-anchor="middle">internal torsions</text>
<line x1="120" y1="300" x2="230" y2="220" stroke="#665A75" stroke-width="6" stroke-linecap="round"/><line x1="230" y1="220" x2="345" y2="305" stroke="#665A75" stroke-width="6" stroke-linecap="round"/><line x1="345" y1="305" x2="465" y2="220" stroke="#665A75" stroke-width="6" stroke-linecap="round"/><circle cx="120" cy="300" r="17" fill="#7A53EC" stroke="white" stroke-width="4"/><circle cx="230" cy="220" r="17" fill="#5F6ED8" stroke="white" stroke-width="4"/><circle cx="345" cy="305" r="17" fill="#3C8F63" stroke="white" stroke-width="4"/><circle cx="465" cy="220" r="17" fill="#C7506B" stroke="white" stroke-width="4"/>
<path d="M120,272 L148,245" class="parrow"/>
<path d="M230,192 L258,165" class="parrow"/>
<path d="M345,277 L373,250" class="parrow"/>
<path d="M465,192 L493,165" class="parrow"/>
<text x="310" y="410" class="small" text-anchor="middle">move every atom • remove translation and rotation</text>
<line x1="700" y1="300" x2="810" y2="235" stroke="#665A75" stroke-width="6" stroke-linecap="round"/><line x1="810" y1="235" x2="925" y2="300" stroke="#665A75" stroke-width="6" stroke-linecap="round"/><line x1="925" y1="300" x2="1040" y2="235" stroke="#665A75" stroke-width="6" stroke-linecap="round"/><circle cx="700" cy="300" r="17" fill="#7A53EC" stroke="white" stroke-width="4"/><circle cx="810" cy="235" r="17" fill="#5F6ED8" stroke="white" stroke-width="4"/><circle cx="925" cy="300" r="17" fill="#3C8F63" stroke="white" stroke-width="4"/><circle cx="1040" cy="235" r="17" fill="#C7506B" stroke="white" stroke-width="4"/>
<circle cx="867" cy="268" r="60" fill="none" stroke="#B7791F" stroke-width="4" stroke-dasharray="8 7"/>
<path d="M825,213 C875,170 945,205 944,260" class="arrow"/>
<text x="890" y="410" class="small" text-anchor="middle">rotate fragments • preserve local bond geometry</text>
<text x="600" y="515" class="body" text-anchor="middle">Cartesian models are topology-agnostic; torsional models build chemical constraints into the state space.</text></svg>