<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#665A75"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #231533; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #665A75; }
      .arrow { stroke: #665A75; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  
      <text x="500" y="42" text-anchor="middle" class="title">A molecular representation is a contract, not just a container</text>
      <rect x="35" y="88" width="290" height="365" rx="20" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/>
      <text x="180" y="128" text-anchor="middle" class="label">one molecular graph</text>
      <line x1="117" y1="215" x2="197" y2="215" stroke="#665A75" stroke-width="5" stroke-linecap="round"/><line x1="197" y1="215" x2="277" y2="215" stroke="#665A75" stroke-width="5" stroke-linecap="round"/><circle cx="117" cy="215" r="24" fill="#231533" stroke="white" stroke-width="3"/><text x="117" y="221" text-anchor="middle" fill="white" font-size="17" font-weight="700">C</text><circle cx="197" cy="215" r="24" fill="#231533" stroke="white" stroke-width="3"/><text x="197" y="221" text-anchor="middle" fill="white" font-size="17" font-weight="700">C</text><circle cx="277" cy="215" r="24" fill="#C7506B" stroke="white" stroke-width="3"/><text x="277" y="221" text-anchor="middle" fill="white" font-size="17" font-weight="700">O</text>
      <text x="197" y="270" text-anchor="middle" class="body">ethanol</text>
      <rect x="70" y="305" width="220" height="48" rx="13" fill="white" stroke="#5F6ED8" stroke-width="2"/>
      <text x="180" y="336" text-anchor="middle" class="body">SMILES: CCO</text>
      <rect x="70" y="373" width="220" height="48" rx="13" fill="white" stroke="#7A53EC" stroke-width="2"/>
      <text x="180" y="404" text-anchor="middle" class="body">SMILES: OCC</text>
      <text x="180" y="438" text-anchor="middle" class="small">different strings, same graph</text>

      <rect x="355" y="88" width="290" height="365" rx="20" fill="#E4F4F2" stroke="#C8BBD8" stroke-width="2"/>
      <text x="500" y="128" text-anchor="middle" class="label">graph attributes carry chemistry</text>
      <circle cx="430" cy="205" r="26" fill="#231533"/><text x="430" y="212" text-anchor="middle" fill="white" font-size="18" font-weight="700">C</text>
      <circle cx="570" cy="205" r="26" fill="#C7506B"/><text x="570" y="212" text-anchor="middle" fill="white" font-size="18" font-weight="700">O</text>
      <line x1="456" y1="205" x2="544" y2="205" stroke="#665A75" stroke-width="5" stroke-linecap="round"/>
      <text x="500" y="186" text-anchor="middle" class="small">single bond</text>
      <text x="500" y="282" text-anchor="middle" class="body">atom type, charge, aromaticity</text>
      <text x="500" y="314" text-anchor="middle" class="body">bond order, stereochemistry</text>
      <text x="500" y="346" text-anchor="middle" class="body">components and attachment sites</text>
      <rect x="397" y="379" width="206" height="43" rx="12" fill="#FFF4DC"/>
      <text x="500" y="406" text-anchor="middle" class="body">decoding must preserve all of them</text>

      <rect x="675" y="88" width="290" height="365" rx="20" fill="#FCE8EE" stroke="#C8BBD8" stroke-width="2"/>
      <text x="820" y="128" text-anchor="middle" class="label">local syntax can still fail</text>
      <line x1="705" y1="190" x2="785" y2="230" stroke="#C7506B" stroke-width="5" stroke-linecap="round"/><line x1="705" y1="270" x2="785" y2="230" stroke="#C7506B" stroke-width="5" stroke-linecap="round"/><line x1="865" y1="230" x2="785" y2="230" stroke="#C7506B" stroke-width="5" stroke-linecap="round"/><circle cx="705" cy="190" r="20" fill="#231533" stroke="white" stroke-width="3"/><text x="705" y="196" text-anchor="middle" fill="white" font-size="17" font-weight="700">C</text><circle cx="705" cy="270" r="20" fill="#231533" stroke="white" stroke-width="3"/><text x="705" y="276" text-anchor="middle" fill="white" font-size="17" font-weight="700">C</text><circle cx="865" cy="230" r="20" fill="#231533" stroke="white" stroke-width="3"/><text x="865" y="236" text-anchor="middle" fill="white" font-size="17" font-weight="700">C</text><circle cx="785" cy="230" r="24" fill="#C7506B" stroke="white" stroke-width="3"/><text x="785" y="236" text-anchor="middle" fill="white" font-size="17" font-weight="700">O</text>
      <text x="820" y="300" text-anchor="middle" class="body">neutral O with three single bonds</text>
      <text x="820" y="331" text-anchor="middle" class="small">graph-shaped, but valence-invalid</text>
      <line x1="760" y1="365" x2="880" y2="365" stroke="#C7506B" stroke-width="5" stroke-linecap="round"/>
      <line x1="820" y1="345" x2="820" y2="385" stroke="#C7506B" stroke-width="5" stroke-linecap="round" transform="rotate(45 820 365)"/>
      <text x="820" y="423" text-anchor="middle" class="body">validity is a coupled constraint</text>

      <rect x="155" y="490" width="690" height="46" rx="14" fill="#F6F2FA"/>
      <text x="500" y="519" text-anchor="middle" class="body">The generator must be invariant to serialization while remaining sensitive to chemical labels.</text>
    
</svg>