<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#665A75"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#231533}.title{font-size:22px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#665A75}.arrow{fill:none;stroke:#665A75;stroke-width:2.5;marker-end:url(#arr)}</style></defs><rect width="100%" height="100%" fill="white"/>
<text x="500" y="40" text-anchor="middle" class="title">Log chooses an initial tangent velocity; exp follows its geodesic</text>
<rect x="45" y="80" width="910" height="395" rx="20" fill="#F2EDFF" stroke="#C8BBD8" stroke-width="2"/>
<ellipse cx="560" cy="295" rx="310" ry="125" fill="#F2EDFF" stroke="#7A53EC" stroke-width="3"/><path d="M250 295C370 155 600 135 825 260" fill="none" stroke="#7A53EC" stroke-width="6"/>
<circle cx="250" cy="295" r="14" fill="#5F6ED8"/><circle cx="825" cy="260" r="14" fill="#16877F"/><text x="225" y="328" class="body">x₀</text><text x="842" y="266" class="body">x₁</text>
<line x1="150" y1="355" x2="455" y2="225" stroke="#C8BBD8" stroke-width="3"/><text x="165" y="392" class="small">tangent plane Tₓ₀𝓜</text>
<path d="M250 295L405 230" stroke="#B7791F" stroke-width="7" marker-end="url(#arr)"/><text x="390" y="207" class="body">logₓ₀(x₁)</text>
<path d="M470 180L585 162" class="arrow"/><text x="527" y="142" text-anchor="middle" class="small">expₓ₀</text>
<text x="500" y="432" text-anchor="middle" class="body">x(t) = exp_x0 [ t log_x0(x1) ]</text>
<rect x="175" y="498" width="650" height="38" rx="13" fill="#FCE8EE"/><text x="500" y="523" text-anchor="middle" class="body">at a cut locus, several shortest geodesics can make log multivalued</text></svg>