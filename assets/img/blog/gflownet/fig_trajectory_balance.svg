<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440" viewBox="0 0 700 440"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#87949a"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6ED8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B7791F"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16877F"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7506B"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#231533"/></marker></defs><style>text{font-family:Arial,Helvetica,'DejaVu Sans',sans-serif;dominant-baseline:middle}.caption{fill:#6f7f86;font-size:15px;font-weight:500}</style><text text-anchor="middle" font-size="23" font-weight="700" fill="#231533"><tspan x="350.0" y="30.0">Trajectory balance on the shared-terminal graph</tspan></text><text text-anchor="middle" font-size="20" font-weight="700" fill="#231533"><tspan x="120.0" y="92.0">Path</tspan></text><text text-anchor="middle" font-size="20" font-weight="700" fill="#231533"><tspan x="320.0" y="92.0">Backward flow</tspan></text><text text-anchor="middle" font-size="20" font-weight="700" fill="#231533"><tspan x="525.0" y="92.0">Forward probability</tspan></text><rect x="25.0" y="127.0" width="650.0" height="46.0" rx="4.0" fill="#F2EDFF" stroke="none" stroke-width="0.0"/><text text-anchor="middle" font-size="21" font-weight="500" fill="#231533"><tspan x="120.0" y="150.0">s0 → s1 → x1</tspan></text><text text-anchor="middle" font-size="21" font-weight="500" fill="#231533"><tspan x="320.0" y="150.0">4 × 1 = 4</tspan></text><text text-anchor="middle" font-size="21" font-weight="500" fill="#231533"><tspan x="525.0" y="150.0">4/7</tspan></text><rect x="25.0" y="180.0" width="650.0" height="46.0" rx="4.0" fill="#ffffff" stroke="none" stroke-width="0.0"/><text text-anchor="middle" font-size="21" font-weight="500" fill="#231533"><tspan x="120.0" y="203.0">s0 → s1 → x2</tspan></text><text text-anchor="middle" font-size="21" font-weight="500" fill="#231533"><tspan x="320.0" y="203.0">2 × ½ = 1</tspan></text><text text-anchor="middle" font-size="21" font-weight="500" fill="#231533"><tspan x="525.0" y="203.0">1/7</tspan></text><rect x="25.0" y="233.0" width="650.0" height="46.0" rx="4.0" fill="#F2EDFF" stroke="none" stroke-width="0.0"/><text text-anchor="middle" font-size="21" font-weight="500" fill="#231533"><tspan x="120.0" y="256.0">s0 → s2 → x2</tspan></text><text text-anchor="middle" font-size="21" font-weight="500" fill="#231533"><tspan x="320.0" y="256.0">2 × ½ = 1</tspan></text><text text-anchor="middle" font-size="21" font-weight="500" fill="#231533"><tspan x="525.0" y="256.0">1/7</tspan></text><rect x="25.0" y="286.0" width="650.0" height="46.0" rx="4.0" fill="#ffffff" stroke="none" stroke-width="0.0"/><text text-anchor="middle" font-size="21" font-weight="500" fill="#231533"><tspan x="120.0" y="309.0">s0 → s2 → x3</tspan></text><text text-anchor="middle" font-size="21" font-weight="500" fill="#231533"><tspan x="320.0" y="309.0">1 × 1 = 1</tspan></text><text text-anchor="middle" font-size="21" font-weight="500" fill="#231533"><tspan x="525.0" y="309.0">1/7</tspan></text><text text-anchor="middle" font-size="22" font-weight="700" fill="#231533"><tspan x="350.0" y="370.0">fB(τ) = w(x) pB(τ | x) = Z pF(τ) = fF(τ)</tspan></text><text text-anchor="middle" font-size="20" font-weight="500" fill="#665A75"><tspan x="350.0" y="408.0">w(x) = exp(R(x));  Z = 7</tspan></text></svg>
