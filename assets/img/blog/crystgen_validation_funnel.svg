<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#665A75"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#231533}.title{font-size:22px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#665A75}.arrow{stroke:#665A75;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs><rect width="100%" height="100%" fill="white"/><text x="500" y="42" text-anchor="middle" class="title">Generation proposes; relaxation and first-principles calculations adjudicate</text>
 <rect x="35" y="100" width="175" height="150" rx="20" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/><text x="122" y="140" text-anchor="middle" class="label">generate</text><text x="122" y="180" text-anchor="middle" class="body">A, L, S</text><text x="122" y="215" text-anchor="middle" class="small">many candidates</text>
 <rect x="260" y="100" width="175" height="150" rx="20" fill="#F6F2FA" stroke="#C8BBD8" stroke-width="2"/><text x="347" y="140" text-anchor="middle" class="label">deduplicate</text><text x="347" y="180" text-anchor="middle" class="body">symmetry + matching</text><text x="347" y="215" text-anchor="middle" class="small">uniqueness, novelty</text>
 <rect x="485" y="100" width="175" height="150" rx="20" fill="#E4F4F2" stroke="#C8BBD8" stroke-width="2"/><text x="572" y="140" text-anchor="middle" class="label">relax</text><text x="572" y="180" text-anchor="middle" class="body">ML potential</text><text x="572" y="215" text-anchor="middle" class="small">forces → local minimum</text>
 <rect x="710" y="100" width="255" height="150" rx="20" fill="#FFF4DC" stroke="#C8BBD8" stroke-width="2"/><text x="837" y="140" text-anchor="middle" class="label">DFT validation</text><text x="837" y="180" text-anchor="middle" class="body">energy, forces, properties</text><text x="837" y="215" text-anchor="middle" class="small">convex hull + dynamic tests</text>
 <path d="M210 175L250 175" class="arrow"/><path d="M435 175L475 175" class="arrow"/><path d="M660 175L700 175" class="arrow"/>
 <path d="M830 265C750 350,640 365,560 305" fill="none" stroke="#C7506B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="654" y="360" width="192" height="28" rx="9" fill="white"/><text x="750" y="379" text-anchor="middle" class="small">large relaxation drift rejects</text>
 <rect x="65" y="320" width="410" height="155" rx="20" fill="#FCE8EE" stroke="#C8BBD8" stroke-width="2"/><text x="270" y="360" text-anchor="middle" class="label">selection bias</text><text x="270" y="400" text-anchor="middle" class="body">DFT sees only candidates favored</text><text x="270" y="428" text-anchor="middle" class="body">by predictors and filters</text><text x="270" y="455" text-anchor="middle" class="small">report every denominator and threshold</text>
 <rect x="535" y="410" width="400" height="65" rx="17" fill="white" stroke="#16877F" stroke-width="3"/><text x="735" y="439" text-anchor="middle" class="body">stable ≠ synthesizable ≠ useful</text><text x="735" y="463" text-anchor="middle" class="small">kinetics, defects, processing, and conditions remain</text>
 <text x="500" y="525" text-anchor="middle" class="small">The pipeline is a sequence of increasingly expensive attempts to falsify a proposal.</text></svg>