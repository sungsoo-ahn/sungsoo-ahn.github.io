      <rect x="80" y="330" width="220" height="88" rx="16" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/><text x="190.0" y="365" text-anchor="middle" class="label">transformed input</text><text x="190.0" y="392" text-anchor="middle" class="small">ρₓ(g)x</text>
