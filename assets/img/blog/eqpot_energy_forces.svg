<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#665A75"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#231533}.title{font-size:22px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#665A75}.arrow{fill:none;stroke:#665A75;stroke-width:2.5;marker-end:url(#arr)}</style></defs><rect width="100%" height="100%" fill="white"/>
<text x="500" y="40" text-anchor="middle" class="title">An interatomic potential should predict one energy surface, then differentiate it</text>
<rect x="45" y="85" width="360" height="370" rx="18" fill="#F2EDFF" stroke="#C8BBD8" stroke-width="2"/><rect x="455" y="85" width="500" height="370" rx="18" fill="#E4F4F2" stroke="#C8BBD8" stroke-width="2"/>
<text x="225" y="122" text-anchor="middle" class="head">extensive invariant energy</text>
<line x1="120" y1="230" x2="230" y2="185" stroke="#C8BBD8" stroke-width="6"/><line x1="230" y1="185" x2="320" y2="265" stroke="#C8BBD8" stroke-width="6"/>
<circle cx="120" cy="230" r="20" fill="#7A53EC" stroke="white" stroke-width="4"/><text x="120" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="white">C</text><circle cx="230" cy="185" r="20" fill="#16877F" stroke="white" stroke-width="4"/><text x="230" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="white">O</text><circle cx="320" cy="265" r="20" fill="#5F6ED8" stroke="white" stroke-width="4"/><text x="320" y="271" text-anchor="middle" font-size="16" font-weight="700" fill="white">H</text>
<rect x="92" y="310" width="266" height="62" rx="18" fill="white" stroke="#7A53EC" stroke-width="2"/><text x="225" y="337" text-anchor="middle" class="body">Eθ = Σᵢ εᵢ</text><text x="225" y="360" text-anchor="middle" class="small">one scalar; unchanged by rigid motion</text>
<text x="705" y="122" text-anchor="middle" class="head">conservative equivariant forces</text>
<line x1="590" y1="260" x2="705" y2="195" stroke="#C8BBD8" stroke-width="6"/><line x1="705" y1="195" x2="820" y2="260" stroke="#C8BBD8" stroke-width="6"/>
<circle cx="590" cy="260" r="20" fill="#7A53EC" stroke="white" stroke-width="4"/><text x="590" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="white">C</text><circle cx="705" cy="195" r="20" fill="#16877F" stroke="white" stroke-width="4"/><text x="705" y="201" text-anchor="middle" font-size="16" font-weight="700" fill="white">O</text><circle cx="820" cy="260" r="20" fill="#5F6ED8" stroke="white" stroke-width="4"/><text x="820" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="white">H</text>
<path d="M590 292L540 340" stroke="#C7506B" stroke-width="6" marker-end="url(#arr)"/><path d="M705 163L705 115" stroke="#C7506B" stroke-width="6" marker-end="url(#arr)"/><path d="M820 292L870 340" stroke="#C7506B" stroke-width="6" marker-end="url(#arr)"/>
<rect x="540" y="365" width="330" height="62" rx="18" fill="white" stroke="#16877F" stroke-width="2"/><text x="705" y="393" text-anchor="middle" class="body">Fᵢ = −∇ᵣᵢ Eθ</text><text x="705" y="416" text-anchor="middle" class="small">one shared potential couples every force</text>
<path d="M410 270L445 270" class="arrow"/>
<rect x="125" y="488" width="750" height="46" rx="14" fill="#FFF4DC"/><text x="500" y="517" text-anchor="middle" class="body">translation invariance ⇒ ΣᵢFᵢ = 0; rotation invariance ⇒ Σᵢ rᵢ × Fᵢ = 0</text></svg>