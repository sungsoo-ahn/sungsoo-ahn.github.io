<rect x="705" y="125" width="205" height="95" rx="16" fill="#FFF4DC" stroke="#C8BBD8" stroke-width="2"/><text x="807" y="160" text-anchor="middle" class="head">local readout</text><text x="807" y="192" text-anchor="middle" class="small">residue, contact, site</text>
<rect x="705" y="245" width="205" height="95" rx="16" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/><text x="807" y="280" text-anchor="middle" class="head">global readout</text><text x="807" y="312" text-anchor="middle" class="small">family or phenotype</text>
