<rect x="414" y="190" width="180" height="150" rx="20" fill="#E4F4F2" stroke="#C8BBD8" stroke-width="2"/><text x="504" y="240" text-anchor="middle" class="head">encoder</text><rect x="463" y="265" width="82" height="25" rx="12" fill="#16877F"/><rect x="445" y="302" width="118" height="15" rx="8" fill="#5F6ED8"/><text x="504" y="365" text-anchor="middle" class="small">shared embedding</text>
