<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#665A75"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#231533}.title{font-size:22px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#665A75}.arrow{fill:none;stroke:#665A75;stroke-width:2.5;marker-end:url(#arr)}.edge{stroke:#C8BBD8;stroke-width:4;stroke-linecap:round}</style></defs><rect width="100%" height="100%" fill="white"/>
<text x="500" y="40" text-anchor="middle" class="title">A pretraining objective decides which information becomes easy to read out</text>
<rect x="45" y="82" width="910" height="390" rx="20" fill="#F2EDFF" stroke="#C8BBD8" stroke-width="2"/>
<rect x="85" y="125" width="215" height="95" rx="16" fill="white" stroke="#C8BBD8" stroke-width="2"/><text x="192" y="160" text-anchor="middle" class="head">masked sequence</text><text x="192" y="192" text-anchor="middle" class="small">recover amino-acid identity</text>
<rect x="85" y="245" width="215" height="95" rx="16" fill="white" stroke="#C8BBD8" stroke-width="2"/><text x="192" y="280" text-anchor="middle" class="head">noisy coordinates</text><text x="192" y="312" text-anchor="middle" class="small">recover local geometry</text>
<rect x="85" y="365" width="215" height="72" rx="16" fill="white" stroke="#C8BBD8" stroke-width="2"/><text x="192" y="397" text-anchor="middle" class="head">paired views</text><text x="192" y="423" text-anchor="middle" class="small">match sequence and structure</text>
