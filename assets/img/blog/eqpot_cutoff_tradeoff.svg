<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#665A75"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#231533}.title{font-size:22px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#665A75}.arrow{fill:none;stroke:#665A75;stroke-width:2.5;marker-end:url(#arr)}</style></defs><rect width="100%" height="100%" fill="white"/>
<text x="500" y="40" text-anchor="middle" class="title">The production tradeoff is smooth local physics versus global reach</text>
<rect x="35" y="82" width="290" height="390" rx="18" fill="#E4F4F2" stroke="#C8BBD8" stroke-width="2"/><rect x="355" y="82" width="290" height="390" rx="18" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/><rect x="675" y="82" width="290" height="390" rx="18" fill="#F2EDFF" stroke="#C8BBD8" stroke-width="2"/>
<text x="180" y="120" text-anchor="middle" class="head">local + smooth</text><circle cx="180" cy="240" r="95" fill="none" stroke="#16877F" stroke-width="3" stroke-dasharray="8 7"/><circle cx="180" cy="240" r="20" fill="#7A53EC" stroke="white" stroke-width="4"/><text x="180" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="white">i</text><circle cx="120" cy="190" r="20" fill="#16877F" stroke="white" stroke-width="4"/><text x="120" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="white">j</text><circle cx="250" cy="275" r="20" fill="#5F6ED8" stroke="white" stroke-width="4"/><text x="250" y="281" text-anchor="middle" font-size="16" font-weight="700" fill="white">k</text>
<path d="M90 382C130 315 190 435 270 330" fill="none" stroke="#16877F" stroke-width="5"/><text x="180" y="431" text-anchor="middle" class="small">envelope and derivative vanish at r꜀</text>
<text x="500" y="120" text-anchor="middle" class="head">global + expressive</text>
<g stroke="#5F6ED8" stroke-width="2" opacity=".65"><line x1="410" y1="190" x2="580" y2="190"/><line x1="410" y1="190" x2="455" y2="330"/><line x1="410" y1="190" x2="585" y2="325"/><line x1="580" y1="190" x2="455" y2="330"/><line x1="580" y1="190" x2="585" y2="325"/><line x1="455" y1="330" x2="585" y2="325"/></g><circle cx="410" cy="190" r="20" fill="#7A53EC" stroke="white" stroke-width="4"/><text x="410" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="white"></text><circle cx="580" cy="190" r="20" fill="#16877F" stroke="white" stroke-width="4"/><text x="580" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="white"></text><circle cx="455" cy="330" r="20" fill="#5F6ED8" stroke="white" stroke-width="4"/><text x="455" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="white"></text><circle cx="585" cy="325" r="20" fill="#B7791F" stroke="white" stroke-width="4"/><text x="585" y="331" text-anchor="middle" font-size="16" font-weight="700" fill="white"></text>
<text x="500" y="402" text-anchor="middle" class="body">long-range response</text><text x="500" y="431" text-anchor="middle" class="small">but dense attention approaches O(N²)</text>
<text x="820" y="120" text-anchor="middle" class="head">equivariant + efficient</text><circle cx="820" cy="240" r="78" fill="#F2EDFF" stroke="#7A53EC" stroke-width="3"/><path d="M820 240L820 148" stroke="#7A53EC" stroke-width="5" marker-end="url(#arr)"/><path d="M820 240L900 278" stroke="#5F6ED8" stroke-width="5" marker-end="url(#arr)"/><text x="820" y="353" text-anchor="middle" class="body">edge-aligned SO(2)</text><text x="820" y="382" text-anchor="middle" class="small">higher angular degree at lower cost</text><text x="820" y="431" text-anchor="middle" class="small">still pays for typed channels and gradients</text>
<rect x="135" y="497" width="730" height="39" rx="13" fill="#FCE8EE"/><text x="500" y="523" text-anchor="middle" class="body">no architecture gets smoothness, infinite range, high angular order, and linear cost for free</text></svg>