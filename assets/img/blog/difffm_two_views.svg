      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #665A75; }
      .arrow { stroke: #665A75; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #665A75; stroke-width: 2.3; fill: none; stroke-dasharray: 8 7; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  
      <text x="500" y="42" text-anchor="middle" class="title">Diffusion and flow matching learn local motion along a probability path</text>
      <rect x="35" y="82" width="440" height="352" rx="20" fill="#F6F2FA" stroke="#C8BBD8" stroke-width="2"/>
      <text x="255" y="122" text-anchor="middle" class="label">diffusion: corrupt, then reverse</text>
      <ellipse cx="140" cy="205" rx="74" ry="68" fill="white" stroke="#7A53EC" stroke-width="3"/>
      <circle cx="105" cy="209" r="9" fill="#7A53EC" stroke="white" stroke-width="2"/><circle cx="137" cy="174" r="9" fill="#7A53EC" stroke="white" stroke-width="2"/><circle cx="145" cy="236" r="9" fill="#7A53EC" stroke="white" stroke-width="2"/><circle cx="176" cy="201" r="9" fill="#7A53EC" stroke="white" stroke-width="2"/>
      <ellipse cx="340" cy="210" rx="84" ry="78" fill="white" stroke="#5F6ED8" stroke-width="3" stroke-dasharray="7 6"/>
      <circle cx="338" cy="164" r="9" fill="#5F6ED8" stroke="white" stroke-width="2"/><circle cx="302" cy="229" r="9" fill="#5F6ED8" stroke="white" stroke-width="2"/><circle cx="375" cy="206" r="9" fill="#5F6ED8" stroke="white" stroke-width="2"/><circle cx="332" cy="264" r="9" fill="#5F6ED8" stroke="white" stroke-width="2"/>
      <path d="M 220 190 C 255 160, 270 160, 290 183" class="arrow"/>
      <path d="M 290 249 C 260 273, 240 270, 218 240" class="arrow"/>
      <text x="255" y="315" text-anchor="middle" class="body">learn the score grad log p_t(x)</text>
      <text x="255" y="344" text-anchor="middle" class="small">the reverse drift points toward likely states</text>
      <rect x="92" y="365" width="326" height="43" rx="12" fill="#FCE8EE"/>
      <text x="255" y="392" text-anchor="middle" class="body">sampling uses a reverse SDE or probability-flow ODE</text>

      <rect x="525" y="82" width="440" height="352" rx="20" fill="#E4F4F2" stroke="#C8BBD8" stroke-width="2"/>
      <text x="745" y="122" text-anchor="middle" class="label">flow matching: prescribe, then regress</text>
      <ellipse cx="660" cy="205" rx="74" ry="68" fill="white" stroke="#16877F" stroke-width="3"/>
      <circle cx="625" cy="209" r="9" fill="#16877F" stroke="white" stroke-width="2"/><circle cx="657" cy="174" r="9" fill="#16877F" stroke="white" stroke-width="2"/><circle cx="665" cy="236" r="9" fill="#16877F" stroke="white" stroke-width="2"/><circle cx="696" cy="201" r="9" fill="#16877F" stroke="white" stroke-width="2"/>
      <ellipse cx="860" cy="210" rx="84" ry="78" fill="white" stroke="#5F6ED8" stroke-width="3" stroke-dasharray="7 6"/>
      <circle cx="858" cy="164" r="9" fill="#5F6ED8" stroke="white" stroke-width="2"/><circle cx="822" cy="229" r="9" fill="#5F6ED8" stroke="white" stroke-width="2"/><circle cx="895" cy="206" r="9" fill="#5F6ED8" stroke="white" stroke-width="2"/><circle cx="852" cy="264" r="9" fill="#5F6ED8" stroke="white" stroke-width="2"/>
      <path d="M 815 236 C 770 275, 735 257, 708 230" stroke="#16877F" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
      <text x="745" y="315" text-anchor="middle" class="body">learn the velocity u_t(x)</text>
      <text x="745" y="344" text-anchor="middle" class="small">the ODE transports probability along the chosen path</text>
      <rect x="582" y="365" width="326" height="43" rx="12" fill="#FFF4DC"/>
      <text x="745" y="392" text-anchor="middle" class="body">sampling integrates one deterministic ODE</text>

      <rect x="190" y="466" width="620" height="55" rx="16" fill="#EEF0FF"/>
      <text x="500" y="489" text-anchor="middle" class="body">shared statistical move</text>
      <text x="500" y="512" text-anchor="middle" class="small">replace an intractable marginal target by a tractable conditional regression target</text>
    
</svg>