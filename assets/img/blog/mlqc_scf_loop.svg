<text x="820" y="120" text-anchor="middle" class="head">direct surrogate</text><g stroke="#C8BBD8" stroke-width="5"><line x1="745" y1="210" x2="820" y2="165"/><line x1="820" y1="165" x2="890" y2="225"/></g><circle cx="745" cy="210" r="15" fill="#7A53EC" stroke="white" stroke-width="3"/><text x="745" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="white">C</text><circle cx="820" cy="165" r="15" fill="#16877F" stroke="white" stroke-width="3"/><text x="820" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="white">O</text><circle cx="890" cy="225" r="15" fill="#5F6ED8" stroke="white" stroke-width="3"/><text x="890" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="white">H</text><path d="M820 265L820 310" class="arrow"/><rect x="748" y="320" width="145" height="72" rx="16" fill="white" stroke="#5F6ED8" stroke-width="2"/><text x="820" y="350" text-anchor="middle" class="body">rho or H</text><text x="820" y="376" text-anchor="middle" class="small">one forward pass</text><text x="820" y="440" text-anchor="middle" class="small">fast, but no SCF fixed-point guarantee</text>
