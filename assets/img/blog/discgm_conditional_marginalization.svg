<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665A75"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7A53EC"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #231533; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 600; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #665A75; }
      .arrow { fill: none; stroke: #665A75; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
      .parrow { fill: none; stroke: #7A53EC; stroke-width: 4; stroke-linecap: round; marker-end: url(#purpleArrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="55" y="48" class="title" text-anchor="start">Simple endpoint-conditioned chains average into the data-generating chain</text>
<rect x="45" y="95" width="290" height="360" rx="28" fill="#F6F2FA" stroke="#7A53EC" stroke-width="3"/>
<text x="190" y="135" class="label" text-anchor="middle">condition on endpoint Z</text>
<circle cx="115" cy="265" r="42" fill="#FFF4DC" stroke="#B7791F" stroke-width="4"/><text x="115" y="272" class="label" text-anchor="middle">M</text>
<circle cx="265" cy="205" r="40" fill="#E5F3EA" stroke="#3C8F63" stroke-width="4"/><text x="265" y="212" class="label" text-anchor="middle">A</text>
<circle cx="265" cy="330" r="40" fill="#EEF0FF" stroke="#5F6ED8" stroke-width="4"/><text x="265" y="337" class="label" text-anchor="middle">B</text>
<path d="M153,244 C190,220 205,210 220,208" class="parrow"/>
<path d="M153,285 C188,316 202,327 220,328" class="parrow"/>
<text x="190" y="395" class="small" text-anchor="middle">known conditional rates qᶻ</text>
<path d="M350,275 L470,275" class="arrow"/>
<rect x="475" y="180" width="250" height="190" rx="28" fill="white" stroke="#C8BBD8" stroke-width="3"/>
<text x="600" y="220" class="label" text-anchor="middle">posterior average</text>
<text x="600" y="265" class="label" text-anchor="middle">q(y | x)</text>
<text x="600" y="300" class="small" text-anchor="middle">= E[qᶻ(y | x) | X=x]</text>
<text x="600" y="340" class="small" text-anchor="middle">the endpoint is latent</text>
<path d="M730,275 L850,275" class="arrow"/>
<rect x="855" y="95" width="300" height="360" rx="28" fill="#E5F3EA" stroke="#3C8F63" stroke-width="3"/>
<text x="1005" y="135" class="label" text-anchor="middle">learn one marginal chain</text>
<circle cx="930" cy="265" r="42" fill="white" stroke="#7A53EC" stroke-width="4"/><text x="930" y="272" class="label" text-anchor="middle">x</text>
<circle cx="1080" cy="205" r="40" fill="white" stroke="#3C8F63" stroke-width="4"/><text x="1080" y="212" class="label" text-anchor="middle">y₁</text>
<circle cx="1080" cy="330" r="40" fill="white" stroke="#5F6ED8" stroke-width="4"/><text x="1080" y="337" class="label" text-anchor="middle">y₂</text>
<path d="M969,244 C1000,222 1020,210 1035,208" class="parrow"/>
<path d="M969,286 C1000,315 1018,326 1035,328" class="parrow"/>
<text x="1005" y="395" class="small" text-anchor="middle">network predicts all outgoing rates</text>
<text x="600" y="515" class="body" text-anchor="middle">Conditional training never requires evaluating the intractable marginal density; it samples an endpoint and an intermediate state.</text>
</svg>