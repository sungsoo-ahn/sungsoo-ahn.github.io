<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#665A75"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#231533}.title{font-size:22px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#665A75}.arrow{fill:none;stroke:#665A75;stroke-width:2.5;marker-end:url(#arr)}.line{fill:none;stroke:#C8BBD8;stroke-width:4;stroke-linecap:round}</style></defs><rect width="100%" height="100%" fill="white"/>
<text x="500" y="40" text-anchor="middle" class="title">Perturbation prediction is a conditional distribution over future cell states</text>
<rect x="45" y="85" width="910" height="385" rx="20" fill="#F2EDFF" stroke="#C8BBD8" stroke-width="2"/>
<rect x="80" y="135" width="205" height="105" rx="16" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/><text x="182" y="173" text-anchor="middle" class="head">baseline state x0</text><text x="182" y="208" text-anchor="middle" class="small">cell type and measured state</text>
<rect x="80" y="265" width="205" height="105" rx="16" fill="#FFF4DC" stroke="#C8BBD8" stroke-width="2"/><text x="182" y="303" text-anchor="middle" class="head">intervention u</text><text x="182" y="338" text-anchor="middle" class="small">drug, dose, edit, time</text>
<rect x="60" y="395" width="245" height="45" rx="14" fill="#E4F4F2" stroke="#C8BBD8" stroke-width="2"/><text x="182" y="423" text-anchor="middle" class="small">context c: donor + environment</text>
<path d="M292 188L405 245" class="arrow"/><path d="M292 317L405 275" class="arrow"/><path d="M292 417L405 300" class="arrow"/>
<rect x="415" y="185" width="190" height="150" rx="20" fill="#E4F4F2" stroke="#C8BBD8" stroke-width="2"/><text x="510" y="225" text-anchor="middle" class="head">response model</text><text x="510" y="265" text-anchor="middle" class="body">p(x1 | x0, u, c)</text><text x="510" y="300" text-anchor="middle" class="small">distribution, not one vector</text>
<path d="M612 260L700 175" class="arrow"/><path d="M612 260L700 350" class="arrow"/>
<rect x="710" y="120" width="210" height="115" rx="16" fill="#EEF0FF" stroke="#C8BBD8" stroke-width="2"/><text x="815" y="157" text-anchor="middle" class="head">observed regime</text><text x="815" y="190" text-anchor="middle" class="small">matched perturbation + context</text><text x="815" y="215" text-anchor="middle" class="small">interpolation</text>
<rect x="710" y="290" width="210" height="135" rx="16" fill="#FCE8EE" stroke="#C8BBD8" stroke-width="2"/><text x="815" y="327" text-anchor="middle" class="head">counterfactual regime</text><text x="815" y="360" text-anchor="middle" class="small">new intervention or donor</text><text x="815" y="387" text-anchor="middle" class="small">requires coverage or assumptions</text>
<rect x="145" y="497" width="710" height="38" rx="13" fill="#FFF4DC"/><text x="500" y="522" text-anchor="middle" class="small">conditioning labels describe an experiment; they do not by themselves identify its causal mechanism</text></svg>